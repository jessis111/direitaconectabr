<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revisão ENEM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ENEM">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2f5bd3">
<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --text:#1d2433; --muted:#5b6478; --line:#e3e6ee;
  --accent:#2f5bd3; --accent-soft:#e8eefc; --ok:#1a8f4c; --ok-soft:#e3f6ea; --bad:#c43a3a; --bad-soft:#fbe7e7;
  --mat:#2f5bd3; --nat:#1a8f4c; --hum:#b26a00; --lin:#8a3fc2; --red:#c43a3a;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11141b; --card:#1a1f2a; --text:#e8ebf2; --muted:#9aa3b5; --line:#2b3242;
    --accent:#7d9cf5; --accent-soft:#232c44; --ok:#4fcf86; --ok-soft:#183324; --bad:#f07a7a; --bad-soft:#3a1f22;
    --mat:#7d9cf5; --nat:#4fcf86; --hum:#f0b55a; --lin:#c79af0; --red:#f07a7a;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;max-width:860px;margin:0 auto}
.top h1{font-size:17px;margin:0}
.score{font-size:13px;color:var(--muted);white-space:nowrap}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;max-width:860px;margin:0 auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer}
nav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:860px;margin:0 auto;padding:16px}
h2{font-size:22px;margin:6px 0 12px}
h3{font-size:17px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.muted{color:var(--muted)}
.small{font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;background:var(--bg)}
.chip.hot{border-color:var(--bad);color:var(--bad)}
.filter{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.filter button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:6px 11px;font-size:14px;cursor:pointer}
.filter button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.q .tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-right:6px}
.q .tema{font-size:12px;color:var(--muted)}
.q .enun{margin:10px 0}
.texto{border-left:3px solid var(--line);padding:4px 0 4px 12px;margin:8px 0;color:var(--muted);font-style:italic}
.alts{display:flex;flex-direction:column;gap:7px}
.alts button{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:10px 12px;font-size:15px;cursor:pointer;line-height:1.4}
.alts button b{display:inline-block;width:22px}
.alts button.certa{background:var(--ok-soft);border-color:var(--ok)}
.alts button.errada{background:var(--bad-soft);border-color:var(--bad)}
.alts button:disabled{cursor:default}
.res{margin-top:12px;display:none}
.res.show{display:block}
.veredito{font-weight:700;margin-bottom:6px}
.veredito.ok{color:var(--ok)} .veredito.no{color:var(--bad)}
.passos{background:var(--bg);border-radius:10px;padding:12px 14px}
.passos ol{margin:6px 0 0;padding-left:20px}
.passos li{margin-bottom:6px}
.dica{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:9px 14px;font-size:15px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
summary{padding:13px 16px;cursor:pointer;font-weight:600}
details .in{padding:0 16px 14px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.area{border-radius:14px;padding:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left;color:var(--text);font-size:15px}
.area strong{display:block;font-size:16px;margin-bottom:2px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok)}
code,.f{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--bg);padding:1px 5px;border-radius:5px;font-size:.92em}
ul.clean{padding-left:20px;margin:6px 0}
.warn{border-color:var(--hum)}
</style>
</head>

<script>
/* =========================================================
   CONTEÚDO

   mais caíram nas provas de 2021 a 2025. Cada uma traz a

const AREAS = {

const MAIS_COBRADOS = {

    freq:["Mecânica (velocidade, energia, força)","Ondulatória e óptica","Termologia (calor, temperatura)","Química orgânica (funções e combustíveis)","Eletroquímica (pilhas, eletrólise)","Doenças, vacinas e imunologia","Evolução (seleção natural)","Fisiologia humana","Radioatividade e meia-vida"]
  },
  hum:{
    muito:["Brasil República (Era Vargas, Ditadura, Redemocratização)","Cidadania, direitos humanos e movimentos sociais","Questões ambientais e uso do território","Urbanização e problemas urbanos","Filosofia política (Hobbes, Locke, Rousseau)"],
    freq:["Escravidão e resistência (quilombos)","Colonização e povos indígenas","Sociologia clássica (Durkheim, Weber, Marx)","Globalização e geopolítica","Agropecuária e fronteira agrícola","Clima, relevo e hidrografia","Filosofia antiga e ética (Sócrates, Platão, Aristóteles, Kant)","Indústria cultural (Escola de Frankfurt)"]

  }

/* Resumos rápidos / fórmulas */
const RESUMOS = {
  mat:[
    ["Porcentagem", `<ul class="clean">
      <li>Aumento de p% → multiplique por <span class="f">(1 + p/100)</span>. Ex.: +25% → ×1,25</li>

      <li>Aumentos/descontos sucessivos: <b>multiplique os fatores</b> (nunca some as porcentagens).</li>
      <li>Variação percentual = (novo − antigo) ÷ antigo × 100</li></ul>`],
    ["Estatística", `<ul class="clean">
      <li><b>Média</b>: soma ÷ quantidade.</li>
      <li><b>Mediana</b>: coloque em ordem; é o valor do meio (se a quantidade for par, média dos dois do meio).</li>
      <li><b>Moda</b>: o valor que mais aparece.</li>
      <li>Média ponderada: Σ(valor × peso) ÷ Σ(pesos).</li></ul>`],
    ["Geometria", `<table>
      <tr><td>Retângulo</td><td>A = b·h</td></tr>
      <tr><td>Triângulo</td><td>A = b·h/2</td></tr>
      <tr><td>Círculo</td><td>A = π·r² &nbsp; C = 2·π·r</td></tr>
      <tr><td>Trapézio</td><td>A = (B + b)·h/2</td></tr>
      <tr><td>Paralelepípedo</td><td>V = a·b·c</td></tr>
      <tr><td>Cilindro</td><td>V = π·r²·h</td></tr>
      <tr><td>Cone / Pirâmide</td><td>V = (Área da base · h)/3</td></tr>
      <tr><td>Esfera</td><td>V = 4·π·r³/3</td></tr>
      <tr><td>Pitágoras</td><td>a² = b² + c²</td></tr></table>`],
    ["Unidades e escala", `<ul class="clean">
      <li>1 m³ = 1000 L &nbsp;|&nbsp; 1 dm³ = 1 L &nbsp;|&nbsp; 1 cm³ = 1 mL</li>
      <li>1 km = 1000 m = 100 000 cm &nbsp;|&nbsp; 1 m² = 10 000 cm²</li>
      <li>1 h = 60 min = 3600 s &nbsp;|&nbsp; km/h ÷ 3,6 = m/s</li>
      <li>Escala 1:E → real = desenho × E (cuidado com a unidade!).</li></ul>`],
    ["Probabilidade e combinatória", `<ul class="clean">
      <li>P = casos favoráveis ÷ casos possíveis.</li>
      <li>"E" (eventos sucessivos) → multiplica. "OU" (excludentes) → soma.</li>
      <li>Princípio multiplicativo: multiplique as opções de cada etapa.</li>
      <li>Ordem importa → arranjo/princípio multiplicativo. Ordem não importa → combinação: C(n,p) = n! / (p!(n−p)!).</li></ul>`],
    ["Funções, juros e sequências", `<ul class="clean">
      <li>1º grau: f(x) = ax + b (a = taxa de variação, b = valor fixo).</li>
      <li>2º grau: vértice x<sub>v</sub> = −b/2a; y<sub>v</sub> = f(x<sub>v</sub>) (máximo se a&lt;0).</li>
      <li>Juros simples: M = C(1 + i·t). Compostos: M = C(1 + i)<sup>t</sup>.</li>
      <li>PA: a<sub>n</sub> = a<sub>1</sub> + (n−1)r. PG: a<sub>n</sub> = a<sub>1</sub>·q<sup>n−1</sup>.</li></ul>`]
  ],
  nat:[
    ["Física — fórmulas essenciais", `<table>
      <tr><td>Velocidade média</td><td>v = Δs/Δt (tempo total, inclusive paradas)</td></tr>
      <tr><td>2ª Lei de Newton</td><td>F = m·a</td></tr>
      <tr><td>Energia cinética</td><td>Ec = m·v²/2</td></tr>
      <tr><td>Energia potencial</td><td>Ep = m·g·h</td></tr>
      <tr><td>Potência</td><td>P = E/t &nbsp; P = U·i</td></tr>
      <tr><td>Lei de Ohm</td><td>U = R·i</td></tr>
      <tr><td>Consumo</td><td>E (kWh) = P (kW) × t (h)</td></tr>
      <tr><td>Ondas</td><td>v = λ·f</td></tr>
      <tr><td>Calor sensível</td><td>Q = m·c·ΔT</td></tr>
      <tr><td>Pressão</td><td>p = F/A; &nbsp; p = d·g·h (líquidos)</td></tr></table>`],
    ["Química — o que mais cai", `<ul class="clean">
      <li><b>Mol</b>: massa (g) ÷ massa molar. 1 mol = 6·10²³ partículas.</li>
      <li><b>Concentração</b>: C = massa do soluto ÷ volume (g/L). Diluição: C₁V₁ = C₂V₂.</li>
      <li><b>pH</b>: &lt;7 ácido, 7 neutro, &gt;7 básico. Cada 1 unidade de pH = 10× na [H⁺].</li>

      <li><b>Pilha</b>: ânodo = oxidação (polo −); cátodo = redução (polo +). Elétrons vão do ânodo para o cátodo.</li>
      <li><b>Chuva ácida</b>: SO₂ e NOₓ. <b>Efeito estufa</b>: CO₂, CH₄. <b>Camada de ozônio</b>: CFCs.</li>
      <li><b>Separação</b>: decantação (líquidos imiscíveis), filtração (sólido + líquido), destilação simples (sal + água), destilação fracionada (líquidos miscíveis, ex. petróleo).</li></ul>`],
    ["Biologia — o que mais cai", `<ul class="clean">
      <li><b>Mendel</b>: Aa × Aa → 1 AA : 2 Aa : 1 aa (3/4 dominante, 1/4 recessivo). Sexo do filho: × 1/2.</li>
      <li><b>Energia na cadeia</b>: diminui a cada nível trófico (~10% passa). <b>Bioacumulação</b>: poluentes aumentam no topo.</li>
      <li><b>Relações</b>: mutualismo (+/+), comensalismo (+/0), parasitismo (+/−), predação (+/−), competição (−/−).</li>
      <li><b>Vacina</b> = imunização ativa (antígeno, gera memória). <b>Soro</b> = passiva (anticorpos prontos, efeito rápido e temporário).</li>
      <li><b>Seleção natural</b>: as variações já existem; o ambiente seleciona as mais adaptadas (resposta típica correta). Lamarck (uso e desuso) costuma ser a alternativa errada.</li>
      <li><b>Ciclo do nitrogênio</b>: bactérias fixadoras (Rhizobium) em leguminosas → adubação verde.</li></ul>`]
  ],
  hum:[
    ["Linha do tempo — Brasil", `<table>
      <tr><td>1500–1822</td><td>Colônia: plantation, escravidão indígena e africana, ciclo do açúcar e do ouro.</td></tr>
      <tr><td>1822–1889</td><td>Império. 1850: Lei Eusébio de Queirós e Lei de Terras. 1888: Lei Áurea (sem integração dos libertos).</td></tr>

      <tr><td>1930–1945</td><td>Era Vargas: CLT (1943), voto feminino (1932), Estado Novo (1937), industrialização (CSN).</td></tr>
      <tr><td>1946–1964</td><td>República Populista: JK (Plano de Metas, Brasília), Jango e reformas de base.</td></tr>
      <tr><td>1964–1985</td><td>Ditadura militar: AI-5 (1968), censura, "milagre econômico", Diretas Já (1984).</td></tr>
      <tr><td>1988</td><td>Constituição Cidadã: direitos sociais, SUS, demarcação de terras indígenas e quilombolas, racismo como crime inafiançável.</td></tr></table>`],
    ["Filosofia e Sociologia", `<table>
      <tr><td>Sócrates</td><td>"Só sei que nada sei"; maiêutica; ironia.</td></tr>
      <tr><td>Platão</td><td>Mundo das Ideias × mundo sensível; Mito da Caverna.</td></tr>
      <tr><td>Aristóteles</td><td>Ética da virtude (justo meio); ser humano como animal político.</td></tr>
      <tr><td>Maquiavel</td><td>Política separada da moral; virtù e fortuna.</td></tr>
      <tr><td>Hobbes</td><td>Estado de natureza = guerra de todos contra todos; soberano absoluto (Leviatã).</td></tr>
      <tr><td>Locke</td><td>Direitos naturais (vida, liberdade, propriedade); direito de resistência; liberalismo.</td></tr>
      <tr><td>Rousseau</td><td>Homem nasce bom, a sociedade corrompe; vontade geral; propriedade privada origina a desigualdade.</td></tr>
      <tr><td>Kant</td><td>Imperativo categórico; autonomia; esclarecimento = sair da menoridade.</td></tr>
      <tr><td>Durkheim</td><td>Fato social (exterior, coercitivo, geral); solidariedade mecânica/orgânica; anomia.</td></tr>
      <tr><td>Weber</td><td>Ação social; tipos de dominação (tradicional, carismática, racional-legal); ética protestante.</td></tr>
      <tr><td>Marx</td><td>Luta de classes; mais-valia; alienação; infraestrutura × superestrutura.</td></tr>
      <tr><td>Adorno/Horkheimer</td><td>Indústria cultural: cultura como mercadoria padronizada.</td></tr>
      <tr><td>Bauman</td><td>Modernidade líquida: relações frágeis e passageiras.</td></tr></table>`],
    ["Geografia — conceitos-chave", `<ul class="clean">
      <li><b>Urbanização brasileira</b>: rápida e desordenada → favelização, segregação socioespacial, periferização, enchentes.</li>
      <li><b>Ilha de calor</b>: asfalto/concreto, pouca vegetação e poluição deixam o centro urbano mais quente.</li>
      <li><b>Inversão térmica</b>: ar frio preso embaixo, poluição concentrada (comum no inverno).</li>
      <li><b>Fronteira agrícola</b>: avanço da soja/gado sobre Cerrado e Amazônia (MATOPIBA) → desmatamento, conflitos fundiários.</li>
      <li><b>Globalização</b>: fluxos de capital, informação e mercadorias; desigual entre países.</li>
      <li><b>Biomas</b>: Amazônia, Cerrado ("berço das águas"), Caatinga, Mata Atlântica (mais devastado), Pampa, Pantanal.</li>
      <li><b>Matriz elétrica brasileira</b>: predominantemente renovável (hidrelétrica), com eólica e solar crescendo.</li></ul>`]
  ],
  lin:[
    ["Funções da linguagem", `<table>
      <tr><td>Referencial</td><td>Informar (notícias, textos científicos).</td></tr>
      <tr><td>Emotiva</td><td>Foco no emissor, sentimentos, 1ª pessoa.</td></tr>
      <tr><td>Conativa/Apelativa</td><td>Convencer o receptor; verbos no imperativo (propaganda).</td></tr>
      <tr><td>Fática</td><td>Testar/manter o canal ("Alô?", "Tá me ouvindo?").</td></tr>
      <tr><td>Metalinguística</td><td>A linguagem falando dela mesma (poema sobre poema, dicionário).</td></tr>
      <tr><td>Poética</td><td>Foco na forma da mensagem (ritmo, rima, sonoridade).</td></tr></table>`],
    ["Figuras de linguagem", `<table>

      <tr><td>Prosopopeia</td><td>Dar características humanas a seres inanimados.</td></tr></table>`],
    ["Literatura e variação", `<ul class="clean">
      <li><b>Variação linguística</b>: regional, social, situacional (formal × informal), histórica. O ENEM <b>valoriza</b> as variedades e combate o preconceito linguístico — a alternativa que diz "forma errada" quase sempre está errada.</li>
      <li><b>Modernismo 1ª fase (1922)</b>: Semana de Arte Moderna; ruptura, verso livre, humor, linguagem coloquial, nacionalismo crítico (Oswald, Mário de Andrade).</li>
      <li><b>2ª fase (1930)</b>: romance regionalista social (Graciliano, Rachel de Queiroz, Jorge Amado); poesia de Drummond, Cecília, Vinicius.</li>

/* ===================== QUESTÕES ===================== */
const Q = [
/* ---------- MATEMÁTICA ---------- */
{a:"mat",m:"Matemática",t:"Porcentagem (aumentos e descontos sucessivos)",
 e:"Uma loja aumentou em 25% o preço de um tênis que custava R$ 80,00. Semanas depois, anunciou uma promoção com 20% de desconto sobre o novo preço. Qual o preço do tênis na promoção?",
 o:["R$ 76,00","R$ 80,00","R$ 84,00","R$ 85,00","R$ 88,00"],c:1,
 p:["Aumento de 25% → multiplicar por 1,25: 80 × 1,25 = 100.","Desconto de 20% → multiplicar por 0,80: 100 × 0,80 = 80.","Atalho: 1,25 × 0,80 = 1,00 → o preço volta ao original."],
 d:"Pegadinha clássica: +25% e −20% NÃO dá +5%. Sempre multiplique os fatores."},
{a:"mat",m:"Matemática",t:"Estatística (mediana)",
 e:"As notas de um aluno em 8 simulados foram: 7, 10, 5, 8, 10, 7, 9, 10. Qual é a mediana dessas notas?",
 o:["8,0","8,25","8,5","9,0","10,0"],c:2,
 p:["Coloque em ordem crescente: 5, 7, 7, 8, 9, 10, 10, 10.","São 8 valores (par) → os do meio são o 4º e o 5º: 8 e 9.","Mediana = (8 + 9) ÷ 2 = 8,5.","(Só para comparar: média = 66 ÷ 8 = 8,25 e moda = 10.)"],
 d:"Esquecer de ordenar os dados é o erro mais comum. As alternativas erradas costumam ser a média e a moda."},
{a:"mat",m:"Matemática",t:"Escala",
 e:"Em um mapa na escala 1 : 250 000, a distância entre duas cidades é de 6 cm. Qual a distância real entre elas?",
 o:["1,5 km","2,5 km","15 km","25 km","150 km"],c:2,
 p:["Escala 1:250 000 → 1 cm no mapa = 250 000 cm na realidade.","6 cm × 250 000 = 1 500 000 cm.","Converter: 1 km = 100 000 cm → 1 500 000 ÷ 100 000 = 15 km."],
 d:"Para converter cm em km, divida por 100 000 (corte 5 zeros)."},
{a:"mat",m:"Matemática",t:"Probabilidade (sem reposição)",
 e:"Uma urna tem 4 bolas vermelhas e 6 azuis. Retiram-se duas bolas, uma após a outra, sem reposição. Qual a probabilidade de as duas serem azuis?",
 o:["1/5","3/10","1/3","9/25","2/5"],c:2,
 p:["1ª retirada: 6 azuis em 10 → 6/10.","Sem reposição: restam 5 azuis em 9 → 5/9.","Eventos sucessivos (\"e\") → multiplica: 6/10 × 5/9 = 30/90 = 1/3."],
 d:"9/25 seria a resposta COM reposição (6/10 × 6/10). Leia com atenção se há reposição."},
{a:"mat",m:"Matemática",t:"Análise combinatória (princípio multiplicativo)",
 e:"Um aplicativo exige senha de 4 dígitos (0 a 9), todos diferentes entre si. Quantas senhas são possíveis?",
 o:["210","3 024","5 040","6 561","10 000"],c:2,
 p:["1º dígito: 10 opções.","2º: 9 (não pode repetir).","3º: 8. 4º: 7.","Total = 10 × 9 × 8 × 7 = 5 040."],
 d:"A ordem importa em senhas (1234 ≠ 4321), então NÃO use combinação (210)."},
{a:"mat",m:"Matemática",t:"Geometria espacial (volume do cilindro) + unidades",
 e:"Uma caixa-d'água cilíndrica tem raio interno de 1 m e altura de 1,5 m. Use π = 3. Qual sua capacidade em litros?",
 o:["450 L","1 500 L","3 000 L","4 500 L","9 000 L"],c:3,
 p:["V = π · r² · h = 3 · 1² · 1,5 = 4,5 m³.","1 m³ = 1 000 L → 4,5 × 1 000 = 4 500 L."],
 d:"Decore: 1 m³ = 1 000 L. Cai praticamente todo ano."},
{a:"mat",m:"Matemática",t:"Função do 1º grau",
 e:"Um táxi cobra R$ 5,00 de bandeirada mais R$ 2,50 por quilômetro rodado. Uma corrida custou R$ 40,00. Quantos quilômetros foram rodados?",
 o:["12 km","14 km","16 km","18 km","20 km"],c:1,
 p:["Monte a função: P(x) = 5 + 2,5x.","40 = 5 + 2,5x → 2,5x = 35.","x = 35 ÷ 2,5 = 14 km."],
 d:"Valor fixo = termo independente (b). Valor por unidade = coeficiente (a)."},
{a:"mat",m:"Matemática",t:"Função do 2º grau (máximo)",
 e:"O lucro mensal de uma pequena fábrica, em milhares de reais, é L(x) = −x² + 40x − 300, em que x é a quantidade de lotes produzidos. Qual o lucro máximo possível?",
 o:["20 mil","100 mil","300 mil","400 mil","500 mil"],c:1,
 p:["a = −1 (concavidade para baixo → tem máximo).","x do vértice = −b/2a = −40/(−2) = 20 lotes.","L(20) = −400 + 800 − 300 = 100 → R$ 100 mil."],
 d:"O ENEM gosta de colocar o x do vértice (20) como alternativa. Ele pergunta o LUCRO, que é o y do vértice."},
{a:"mat",m:"Matemática",t:"Juros compostos",
 e:"Uma pessoa aplicou R$ 1 000,00 a juros compostos de 10% ao mês. Qual o montante após 2 meses?",
 o:["R$ 1 020,00","R$ 1 100,00","R$ 1 200,00","R$ 1 210,00","R$ 1 331,00"],c:3,
 p:["M = C · (1 + i)ᵗ = 1 000 · (1,1)².","1,1² = 1,21.","M = 1 000 × 1,21 = R$ 1 210,00."],
 d:"R$ 1 200 seria juros simples. R$ 1 331 seria 3 meses."},
{a:"mat",m:"Matemática",t:"Sequências (PA)",
 e:"Com palitos, uma criança forma quadrados lado a lado: 1 quadrado usa 4 palitos, 2 quadrados usam 7, 3 quadrados usam 10. Quantos palitos são necessários para 20 quadrados?",
 o:["58","60","61","64","80"],c:2,
 p:["A sequência 4, 7, 10… aumenta 3 a cada quadrado → PA com a₁ = 4 e r = 3.","aₙ = a₁ + (n − 1)·r → a₂₀ = 4 + 19·3.","a₂₀ = 4 + 57 = 61."],
 d:"80 (20 × 4) ignora os lados compartilhados. Sempre descubra o padrão com os primeiros termos."},
{a:"mat",m:"Matemática",t:"Regra de três inversa",
 e:"Seis pedreiros constroem um muro em 10 dias. Mantido o mesmo ritmo, em quantos dias 4 pedreiros construiriam o mesmo muro?",
 o:["6,7 dias","12 dias","15 dias","16 dias","20 dias"],c:2,
 p:["Menos pedreiros → mais dias: grandezas INVERSAMENTE proporcionais.","Na inversa, o produto é constante: 6 × 10 = 4 × x.","60 = 4x → x = 15 dias."],
 d:"Pergunte sempre: 'se um aumenta, o outro aumenta ou diminui?' Diminui → inversa."},
{a:"mat",m:"Matemática",t:"Geometria plana (área) + conversão",
 e:"Um salão retangular de 12 m por 20 m será coberto com placas quadradas de 40 cm de lado. Quantas placas serão necessárias (sem perdas)?",
 o:["150","600","1 500","6 000","15 000"],c:2,
 p:["Área do salão: 12 × 20 = 240 m².","Placa: 0,40 m × 0,40 m = 0,16 m².","Número de placas: 240 ÷ 0,16 = 1 500."],
 d:"Converta tudo para a MESMA unidade antes de dividir (40 cm = 0,40 m)."},
{a:"mat",m:"Matemática",t:"Teorema de Pitágoras",
 e:"Uma escada de 5 m está apoiada em uma parede, com o pé a 3 m de distância da base da parede. A que altura a escada toca a parede?",
 o:["2 m","3 m","4 m","5 m","8 m"],c:2,
 p:["A escada é a hipotenusa (5); a distância ao chão é um cateto (3).","5² = 3² + h² → 25 = 9 + h².","h² = 16 → h = 4 m (triângulo 3-4-5)."],
 d:"Memorize os trios pitagóricos: 3-4-5, 6-8-10, 5-12-13."},
{a:"mat",m:"Matemática",t:"Variação percentual (leitura de tabela)",
 e:"Uma empresa vendeu 200 unidades em março e 250 em abril. Em maio, as vendas caíram para 200 unidades. Quais foram as variações percentuais de março→abril e de abril→maio, respectivamente?",
 o:["+25% e −25%","+25% e −20%","+20% e −20%","+50% e −50%","+20% e −25%"],c:1,
 p:["Março→abril: (250 − 200) ÷ 200 = 50/200 = +25%.","Abril→maio: (200 − 250) ÷ 250 = −50/250 = −20%.","A base é sempre o valor ANTIGO de cada período."],
 d:"A mesma diferença (50) gera porcentagens diferentes porque a base muda."},

/* ---------- CIÊNCIAS DA NATUREZA ---------- */
{a:"nat",m:"Física",t:"Eletricidade (consumo em kWh)",
 e:"Um chuveiro de 5 500 W é usado 20 minutos por dia, durante 30 dias. Se o kWh custa R$ 0,80, quanto esse chuveiro custa por mês?",
 o:["R$ 22,00","R$ 44,00","R$ 55,00","R$ 88,00","R$ 132,00"],c:1,
 p:["Potência em kW: 5 500 W = 5,5 kW.","Tempo em horas: 20 min/dia × 30 dias = 600 min = 10 h.","Energia: E = P × t = 5,5 × 10 = 55 kWh.","Custo: 55 × 0,80 = R$ 44,00."],
 d:"Erro comum: usar W em vez de kW ou minutos em vez de horas. 55 é a energia, não o custo."},
{a:"nat",m:"Física",t:"Velocidade média",
 e:"Um ônibus percorre 90 km em 1 h, para 30 min em um posto e depois percorre mais 90 km em 1 h 30 min. Qual a velocidade média da viagem completa?",
 o:["45 km/h","60 km/h","72 km/h","80 km/h","90 km/h"],c:1,
 p:["Distância total: 90 + 90 = 180 km.","Tempo total (com a parada!): 1 h + 0,5 h + 1,5 h = 3 h.","v = 180 ÷ 3 = 60 km/h."],
 d:"A parada entra no tempo total. 72 km/h é a resposta de quem esquece a parada (180 ÷ 2,5)."},
{a:"nat",m:"Física",t:"Conservação de energia",
 e:"Um objeto é solto, a partir do repouso, de uma altura de 5 m. Desprezando a resistência do ar e usando g = 10 m/s², com que velocidade ele chega ao solo?",
 o:["5 m/s","10 m/s","25 m/s","50 m/s","100 m/s"],c:1,
 p:["Energia potencial vira energia cinética: m·g·h = m·v²/2.","A massa cancela: v² = 2·g·h = 2 · 10 · 5 = 100.","v = √100 = 10 m/s."],
 d:"Repare que a massa não importa — sem atrito, tudo cai igual."},
{a:"nat",m:"Física",t:"Ondulatória (v = λ·f)",
 e:"Uma rádio FM transmite na frequência de 100 MHz. Sabendo que as ondas de rádio se propagam a 3 × 10⁸ m/s, qual o comprimento de onda?",
 o:["0,3 m","3 m","30 m","300 m","3 000 m"],c:1,
 p:["100 MHz = 100 × 10⁶ Hz = 10⁸ Hz.","λ = v ÷ f = 3 × 10⁸ ÷ 10⁸.","λ = 3 m."],
 d:"Prefixos: k = 10³, M = 10⁶, G = 10⁹."},
{a:"nat",m:"Física",t:"Circuitos residenciais",
 e:"Nas residências, as tomadas e lâmpadas são ligadas em paralelo. Qual a principal vantagem desse tipo de ligação?",
 o:["A corrente elétrica é a mesma em todos os aparelhos.","Cada aparelho recebe a mesma tensão e funciona de forma independente.","A resistência total aumenta, economizando energia.","Se um aparelho queimar, todos os outros desligam.","A potência de todos os aparelhos se torna igual."],c:1,
 p:["Em paralelo, todos os aparelhos ficam ligados aos mesmos dois fios → mesma tensão (127 V ou 220 V).","Se um aparelho é desligado ou queima, o caminho dos outros continua fechado → funcionam independentemente.","Em série é o contrário: mesma corrente e, se um queima, todos apagam (pisca-pisca antigo)."],
 d:"Ligar muitos aparelhos em paralelo aumenta a corrente total → por isso o disjuntor desarma."},
{a:"nat",m:"Física",t:"Calorimetria (Q = m·c·ΔT)",
 e:"Quanto calor é necessário para aquecer 1 litro de água (1 000 g) de 20 °C até 100 °C? Dado: calor específico da água = 1 cal/g·°C.",
 o:["8 kcal","20 kcal","80 kcal","100 kcal","800 kcal"],c:2,
 p:["Q = m · c · ΔT.","ΔT = 100 − 20 = 80 °C.","Q = 1 000 × 1 × 80 = 80 000 cal = 80 kcal."],
 d:"'Que macete' para lembrar: Q = m·c·ΔT."},
{a:"nat",m:"Física",t:"Óptica da visão",
 e:"Uma pessoa míope enxerga mal objetos distantes, pois a imagem se forma antes da retina. Que tipo de lente corrige esse problema?",
 o:["Convergente, que aproxima a imagem do cristalino.","Divergente, que desloca a imagem para trás, sobre a retina.","Cilíndrica, que corrige a curvatura da córnea.","Bifocal, que aumenta o tamanho dos objetos.","Convergente, que desloca a imagem para trás."],c:1,
 p:["Miopia: olho 'alongado' ou convergente demais → imagem antes da retina.","Precisa diminuir a convergência → lente DIVERGENTE.","Hipermetropia é o inverso: imagem depois da retina → lente convergente. Astigmatismo → lente cilíndrica."],
 d:"Miopia → Menos (lente negativa, divergente)."},
{a:"nat",m:"Química",t:"Soluções (concentração e diluição)",
 e:"Um técnico dissolveu 20 g de sal em água até completar 500 mL de solução. Em seguida, adicionou água até o volume chegar a 2 L. Qual a concentração final?",
 o:["4 g/L","10 g/L","20 g/L","40 g/L","80 g/L"],c:1,
 p:["Concentração inicial: 20 g ÷ 0,5 L = 40 g/L.","Diluição: C₁V₁ = C₂V₂ → 40 × 0,5 = C₂ × 2.","C₂ = 20 ÷ 2 = 10 g/L. (Ou direto: 20 g ÷ 2 L.)"],
 d:"Na diluição, a massa de soluto NÃO muda; só o volume aumenta."},
{a:"nat",m:"Química",t:"Estequiometria",
 e:"Na combustão do metano: CH₄ + 2 O₂ → CO₂ + 2 H₂O. Queimando-se 32 g de metano, qual a massa de CO₂ produzida? (C = 12, H = 1, O = 16)",
 o:["22 g","44 g","64 g","88 g","176 g"],c:3,
 p:["Massa molar do CH₄ = 12 + 4 = 16 g/mol → 32 g = 2 mol.","Proporção da equação: 1 CH₄ : 1 CO₂ → 2 mol de CO₂.","Massa molar do CO₂ = 12 + 32 = 44 g/mol → 2 × 44 = 88 g."],
 d:"Roteiro: massa → mol → proporção da equação → mol → massa."},
{a:"nat",m:"Química",t:"Radioatividade (meia-vida)",
 e:"Um isótopo radioativo tem meia-vida de 5 anos. Partindo de 80 g, quanto restará após 20 anos?",
 o:["2,5 g","5 g","10 g","20 g","40 g"],c:1,
 p:["Número de meias-vidas: 20 ÷ 5 = 4.","80 → 40 → 20 → 10 → 5 g.","Ou: 80 ÷ 2⁴ = 80 ÷ 16 = 5 g."],
 d:"Não é linear! Não faça 80 − 4 × 20."},
{a:"nat",m:"Química",t:"pH",
 e:"O suco de limão tem pH ≈ 2 e a água pura tem pH = 7. Quantas vezes a concentração de íons H⁺ do suco é maior que a da água?",
 o:["5 vezes","3,5 vezes","50 vezes","1 000 vezes","100 000 vezes"],c:4,
 p:["pH = −log[H⁺] → [H⁺] = 10⁻ᵖᴴ.","Limão: 10⁻²; água: 10⁻⁷.","Razão: 10⁻² ÷ 10⁻⁷ = 10⁵ = 100 000 vezes."],
 d:"Cada 1 unidade de pH = 10 vezes. A escala é logarítmica."},
{a:"nat",m:"Química",t:"Química ambiental",
 e:"Em cidades com muitas indústrias que queimam carvão e combustíveis fósseis, ocorre a chuva ácida, que corrói monumentos e prejudica a vegetação. Quais gases são os principais responsáveis?",
 o:["CO₂ e O₂","SO₂ e NOₓ (óxidos de enxofre e nitrogênio)","CFCs","O₃ e N₂","CH₄ e H₂"],c:1,
 p:["Combustíveis fósseis contêm enxofre → liberam SO₂, que forma H₂SO₄ (ácido sulfúrico) com a água.","Altas temperaturas em motores formam NOₓ → HNO₃ (ácido nítrico).","O CO₂ deixa a chuva naturalmente um pouco ácida (pH ≈ 5,6), mas ele é o principal gás do efeito estufa, não o causador da chuva ácida."],
 d:"Chuva ácida = SO₂ + NOₓ. Efeito estufa = CO₂ + CH₄. Buraco na camada de ozônio = CFC."},
{a:"nat",m:"Química",t:"Separação de misturas",
 e:"Para obter água potável a partir da água do mar em um navio, qual processo de separação é adequado?",
 o:["Filtração","Decantação","Destilação simples","Centrifugação","Peneiração"],c:2,
 p:["O sal está DISSOLVIDO na água (mistura homogênea) → filtrar ou decantar não separa.","Na destilação simples, a água evapora e é condensada; o sal fica no recipiente.","Outra opção real é a osmose reversa (membranas)."],
 d:"Mistura homogênea sólido + líquido → destilação simples."},
{a:"nat",m:"Química",t:"Eletroquímica (pilhas)",
 e:"Em uma pilha, ocorre a transferência de elétrons entre dois metais. Sobre o ânodo, é correto afirmar:",
 o:["Sofre redução e é o polo positivo.","Sofre oxidação e é o polo negativo, de onde saem os elétrons.","Recebe os elétrons do cátodo.","Tem sua massa aumentada durante o funcionamento.","É sempre o metal mais nobre."],c:1,
 p:["Ânodo → Oxidação (as duas palavras começam com vogal).","Na oxidação o metal perde elétrons → eles saem do ânodo e vão pelo fio até o cátodo.","O ânodo se desgasta (perde massa); o cátodo, onde há redução, geralmente ganha massa."],
 d:"Macete: 'ÂNODO OXIDA, CÁTODO REDUZ' (vogal com vogal, consoante com consoante)."},
{a:"nat",m:"Biologia",t:"Genética (1ª Lei de Mendel)",
 e:"Um casal, ambos com pigmentação normal, é heterozigoto para o albinismo (herança autossômica recessiva). Qual a probabilidade de terem uma MENINA albina?",
 o:["1/2","1/4","1/8","3/4","3/8"],c:2,
 p:["Cruzamento Aa × Aa → AA, Aa, Aa, aa.","Probabilidade de ser albino (aa) = 1/4.","Probabilidade de ser menina = 1/2.","Menina E albina → multiplica: 1/4 × 1/2 = 1/8."],
 d:"Se a pergunta citar o sexo, multiplique por 1/2 (exceto em herança ligada ao X, que tem regra própria)."},
{a:"nat",m:"Biologia",t:"Ecologia (bioacumulação)",
 e:"Um rio foi contaminado por mercúrio de garimpo. Na cadeia alimentar fitoplâncton → zooplâncton → peixe pequeno → peixe grande → ser humano, onde a concentração de mercúrio por quilo de tecido tende a ser maior?",
 o:["No fitoplâncton","No zooplâncton","No peixe pequeno","Igual em todos os níveis","No ser humano, no topo da cadeia"],c:4,
 p:["O mercúrio não é eliminado facilmente → acumula no corpo (bioacumulação).","Cada consumidor come muitos indivíduos do nível anterior, somando o metal deles.","Resultado: a concentração aumenta a cada nível (biomagnificação) → maior no topo."],
 d:"Energia DIMINUI subindo a cadeia; poluentes não biodegradáveis AUMENTAM."},
{a:"nat",m:"Biologia",t:"Relações ecológicas",
 e:"Os líquens são formados pela associação entre fungos e algas: a alga faz fotossíntese e fornece alimento; o fungo protege e retém umidade. Essa relação é:",
 o:["Parasitismo","Comensalismo","Mutualismo","Competição","Predatismo"],c:2,
 p:["Os dois lados ganham (+/+).","E a associação é necessária para sobreviverem naquele ambiente.","Relação +/+ obrigatória = mutualismo."],
 d:"Comensalismo: um ganha e o outro é indiferente (+/0). Ex.: rêmora e tubarão."},
{a:"nat",m:"Biologia",t:"Imunologia (vacina × soro)",
 e:"Uma pessoa picada por uma cobra peçonhenta precisa de tratamento imediato. O que deve ser aplicado e por quê?",
 o:["Vacina, pois estimula a produção de memória imunológica.","Soro, pois contém anticorpos prontos que neutralizam o veneno rapidamente.","Antibiótico, pois o veneno é formado por bactérias.","Vacina, pois contém anticorpos prontos.","Soro, pois estimula o organismo a produzir anticorpos."],c:1,
 p:["Emergência → não há tempo para o corpo produzir anticorpos.","O soro traz anticorpos prontos (imunização passiva) → ação rápida, mas temporária.","A vacina traz antígenos e gera memória (imunização ativa) → prevenção, não tratamento de urgência."],
 d:"Soro = cura rápida (passiva). Vacina = prevenção (ativa, com memória)."},
{a:"nat",m:"Biologia",t:"Evolução (seleção natural)",
 e:"O uso indiscriminado de antibióticos tem levado ao surgimento de bactérias resistentes. A explicação evolutiva correta é:",
 o:["As bactérias se adaptaram ao antibiótico porque precisavam sobreviver.","O antibiótico provocou mutações para resistência em todas as bactérias.","Bactérias resistentes já existiam na população e foram selecionadas, pois sobreviveram e se reproduziram.","O uso constante do antibiótico fortaleceu as bactérias, como um músculo.","As bactérias transmitiram aos descendentes as características adquiridas durante a vida."],c:2,
 p:["Na população, já há variação genética (algumas bactérias resistentes por mutação ao acaso).","O antibiótico mata as sensíveis → as resistentes sobrevivem e se multiplicam.","Isso é seleção natural (Darwin). As alternativas A, D e E são ideias lamarckistas."],
 d:"O ambiente SELECIONA, não CAUSA a característica. Desconfie de 'para se adaptar' ou 'porque precisava'."},
{a:"nat",m:"Biologia",t:"Ciclo do nitrogênio",
 e:"Agricultores plantam feijão ou soja entre safras para melhorar a fertilidade do solo, reduzindo o uso de adubos químicos. Isso funciona porque:",
 o:["Essas plantas fazem fotossíntese mais intensa.","Suas raízes se associam a bactérias que fixam o nitrogênio do ar no solo.","Elas absorvem o excesso de nitrogênio do solo.","Elas liberam fósforo pelas folhas.","Elas impedem a ação de decompositores."],c:1,
 p:["Leguminosas (feijão, soja, ervilha) têm nódulos nas raízes com bactérias do gênero Rhizobium.","Essas bactérias transformam N₂ do ar em compostos que as plantas usam (fixação biológica).","Ao serem incorporadas ao solo, enriquecem-no com nitrogênio → adubação verde."],
 d:"Leguminosa + Rhizobium = fixação de nitrogênio. Cai muito!"},

/* ---------- CIÊNCIAS HUMANAS ---------- */
{a:"hum",m:"História",t:"Era Vargas",
 e:"Entre 1930 e 1945, o governo de Getúlio Vargas buscou se aproximar dos trabalhadores urbanos, ao mesmo tempo que controlava os sindicatos. Uma medida típica desse período foi:",
 o:["A abolição da escravatura","A criação da Consolidação das Leis do Trabalho (CLT)","A construção de Brasília","A edição do AI-5","A criação do Plano Real"],c:1,
 p:["CLT (1943) reuniu leis trabalhistas: carteira de trabalho, salário mínimo, férias, jornada de 8 h.","Fazia parte do trabalhismo/populismo varguista: conceder direitos e controlar os sindicatos pelo Estado.","Distratores: abolição (1888), Brasília (JK), AI-5 (ditadura, 1968), Plano Real (1994)."],
 d:"Vargas = CLT, voto feminino (1932), Estado Novo (1937), CSN e Petrobras."},
{a:"hum",m:"História",t:"Ditadura militar",
 e:"Decretado em dezembro de 1968, esse ato institucional fechou o Congresso, ampliou a censura e suspendeu o habeas corpus para crimes políticos, marcando o período mais repressivo do regime. Trata-se do:",
 o:["AI-1","AI-2","AI-5","Ato Adicional de 1834","Decreto da Anistia"],c:2,
 p:["Contexto: 1968, protestos estudantis (Passeata dos Cem Mil) e oposição crescente.","O AI-5 deu poderes amplos ao presidente: fechar o Congresso, cassar mandatos, censura prévia.","Iniciaram-se os 'anos de chumbo' (governo Médici), com tortura e perseguições."],
 d:"AI-5 = 1968 = endurecimento máximo. Anistia = 1979. Diretas Já = 1984."},
{a:"hum",m:"História",t:"Abolição e pós-abolição",
 e:"\"A Lei Áurea libertou os escravizados, mas não lhes deu terra, educação ou trabalho.\" A afirmação ajuda a compreender:",
 o:["A rápida integração dos libertos ao mercado formal de trabalho.","A origem de desigualdades raciais que persistem na sociedade brasileira.","A distribuição de terras aos ex-escravizados após 1888.","O fim imediato do racismo no Brasil.","A criação de políticas de indenização para os libertos."],c:1,
 p:["A abolição (1888) não veio acompanhada de políticas de inclusão.","A Lei de Terras (1850) já dificultava o acesso à terra pelos mais pobres.","Os libertos foram marginalizados → raiz de desigualdades raciais atuais (moradia, renda, educação)."],
 d:"O ENEM valoriza a leitura crítica: abolição formal ≠ cidadania plena."},
{a:"hum",m:"Filosofia",t:"Contratualismo (Hobbes)",
 e:"\"Enquanto os homens vivem sem um poder comum capaz de mantê-los em respeito, eles se encontram naquela condição a que se chama guerra; uma guerra de todos contra todos.\" Para o autor desse trecho, a solução é:",
 o:["Retornar ao estado de natureza, onde o homem é bom.","Criar um Estado soberano forte, ao qual os indivíduos transferem seus direitos em troca de segurança.","Abolir o Estado e a propriedade privada.","Garantir o direito de rebelião contra qualquer governo.","Dividir o poder em Executivo, Legislativo e Judiciário."],c:1,
 p:["'Guerra de todos contra todos' → Thomas Hobbes (Leviatã).","Para ele, o medo da morte leva os homens a um contrato social: abrem mão da liberdade em troca de proteção.","O soberano deve ter poder absoluto. Distratores: A = Rousseau (homem bom), C = ideia marxista/anarquista, D = Locke (direito de resistência), E = Montesquieu (três poderes)."],
 d:"Hobbes = medo e segurança. Locke = propriedade e resistência. Rousseau = vontade geral."},
{a:"hum",m:"Sociologia",t:"Durkheim (fato social)",
 e:"Para Émile Durkheim, um fato social apresenta três características. Quais são elas?",
 o:["Individualidade, liberdade e espontaneidade","Exterioridade, coercitividade e generalidade","Luta de classes, alienação e mais-valia","Ação racional, afetiva e tradicional","Fluidez, consumo e individualismo"],c:1,
 p:["Exterior: existe fora e antes do indivíduo (ex.: a língua, as leis).","Coercitivo: se impõe, com sanções a quem desobedece.","Geral: atinge o grupo, não apenas uma pessoa.","Distratores: C = Marx; D = Weber; E = Bauman."],
 d:"Associe autor → conceito. Cai muito no formato 'qual pensador sustenta essa ideia'."},
{a:"hum",m:"Sociologia",t:"Indústria cultural",
 e:"Para os filósofos da Escola de Frankfurt, a produção de filmes, músicas e programas em série transforma a cultura em mercadoria padronizada, voltada ao lucro e ao entretenimento passivo. Esse conceito é chamado de:",
 o:["Modernidade líquida","Indústria cultural","Contrato social","Solidariedade orgânica","Mais-valia"],c:1,
 p:["Adorno e Horkheimer (Escola de Frankfurt) criaram o termo 'indústria cultural'.","Ideia central: a cultura de massa padroniza gostos e reduz o pensamento crítico.","Aparece muito em questões sobre redes sociais, streaming e publicidade."],
 d:"Palavras-chave: padronização, mercadoria, consumo, massificação → indústria cultural."},
{a:"hum",m:"Geografia",t:"Clima urbano (ilha de calor)",
 e:"Áreas centrais das grandes cidades costumam registrar temperaturas mais altas que as áreas periféricas e rurais vizinhas. Esse fenômeno decorre principalmente:",
 o:["Da maior altitude dos centros urbanos.","Da impermeabilização do solo, da concentração de edifícios e da escassez de vegetação.","Da presença de massas de ar polar.","Da maior umidade relativa do ar nos centros.","Da inversão térmica, que só ocorre no verão."],c:1,
 p:["Asfalto e concreto absorvem e retêm calor.","Prédios dificultam a circulação do vento; poucas árvores = menos sombra e evapotranspiração.","Carros e indústrias liberam calor e poluentes → 'ilha de calor'."],
 d:"Não confunda: ilha de calor (centro mais quente) × inversão térmica (poluição presa, mais comum no inverno)."},
{a:"hum",m:"Geografia",t:"Fronteira agrícola e meio ambiente",
 e:"Nas últimas décadas, a expansão do cultivo de soja e da pecuária sobre o Cerrado e a Amazônia, em áreas como o MATOPIBA, tem provocado:",
 o:["Redução do desmatamento e dos conflitos por terra.","Desmatamento, perda de biodiversidade e conflitos com povos tradicionais.","Aumento da agricultura familiar de subsistência.","Fim da concentração fundiária.","Recuperação das nascentes do Cerrado."],c:1,
 p:["MATOPIBA = Maranhão, Tocantins, Piauí e Bahia: nova fronteira agrícola.","Monocultura de exportação (commodities) exige grandes áreas → desmatamento.","Consequências: perda de biodiversidade, impacto nas nascentes, conflitos com indígenas, quilombolas e camponeses."],
 d:"O Cerrado é o 'berço das águas': abastece grandes bacias hidrográficas brasileiras."},
{a:"hum",m:"Geografia",t:"Urbanização brasileira",
 e:"O crescimento acelerado das cidades brasileiras a partir de 1950, sem planejamento adequado, resultou em:",
 o:["Distribuição igualitária da infraestrutura urbana.","Segregação socioespacial, com ocupação de áreas de risco pela população pobre.","Esvaziamento das regiões metropolitanas.","Redução do déficit habitacional.","Diminuição das enchentes urbanas."],c:1,
 p:["Êxodo rural + industrialização → explosão urbana.","Valorização do solo expulsa os mais pobres para periferias e encostas.","Resultado: favelas, moradias em áreas de risco, longas viagens casa-trabalho, desigualdade no acesso a serviços."],
 d:"Palavras-chave que costumam ser a resposta: segregação socioespacial, periferização, especulação imobiliária."},

/* ---------- LINGUAGENS ---------- */
{a:"lin",m:"Português",t:"Funções da linguagem",
 e:"<div class='texto'>\"Não deixe para depois. Vacine-se! Proteja você e quem você ama.\"</div>A função da linguagem predominante nesse texto de campanha é:",
 o:["Referencial","Emotiva","Conativa (apelativa)","Metalinguística","Fática"],c:2,
 p:["O texto se dirige diretamente ao leitor ('você').","Usa verbos no imperativo ('Vacine-se', 'Proteja').","Objetivo: convencer/levar a uma ação → função conativa."],
 d:"Imperativo + 'você' + objetivo de persuadir = conativa."},
{a:"lin",m:"Português",t:"Variação linguística",
 e:"<div class='texto'>\"Ocê vai no forró hoje, sô? Num perde não, que vai sê bão demais!\"</div>Sobre a fala reproduzida, é correto afirmar que:",
 o:["Apresenta erros que devem ser corrigidos para ter valor comunicativo.","Representa uma variedade regional legítima, adequada a uma situação informal.","É inferior à norma-padrão e deve ser evitada em qualquer situação.","Indica falta de escolaridade do falante.","Não pode ser compreendida por falantes de outras regiões."],c:1,
 p:["Marcas como 'ocê', 'sô', 'bão' indicam variação regional (mineira).","O contexto é informal (convite para um forró) → a variedade é adequada.","O ENEM trata a língua como diversa; não há 'certo e errado', mas adequado/inadequado ao contexto."],
 d:"Alternativas com 'erro', 'inferior' ou 'falta de escolaridade' quase sempre estão erradas (preconceito linguístico)."},
{a:"lin",m:"Português",t:"Figuras de linguagem",
 e:"Na frase \"Durante as férias, ela leu Machado de Assis inteiro\", ocorre:",
 o:["Metáfora","Metonímia","Hipérbole","Ironia","Antítese"],c:1,
 p:["Ela não 'leu a pessoa' Machado de Assis, e sim as OBRAS dele.","Substituir a obra pelo autor = troca de termos com relação de proximidade.","Isso é metonímia."],
 d:"Metonímia: autor pela obra, marca pelo produto ('tomei um Danone'), parte pelo todo."},
{a:"lin",m:"Português",t:"Coesão (conectivos)",
 e:"<div class='texto'>\"O acesso à internet cresceu no país; <u>no entanto</u>, milhões de pessoas ainda estão desconectadas.\"</div>O conectivo destacado estabelece relação de:",
 o:["Conclusão","Causa","Oposição","Adição","Tempo"],c:2,
 p:["A 1ª parte diz que o acesso cresceu.","A 2ª parte traz uma ideia contrária (ainda há excluídos).","'No entanto' = mas, porém, contudo → oposição/adversidade."],
 d:"Teste: troque por 'mas'. Se o sentido se mantém, é oposição."},
{a:"lin",m:"Literatura",t:"Modernismo (1ª fase)",
 e:"A Semana de Arte Moderna de 1922 e a primeira fase do Modernismo brasileiro caracterizaram-se por:",
 o:["Rigor formal, rimas ricas e vocabulário rebuscado.","Ruptura com a tradição, verso livre, linguagem coloquial e nacionalismo crítico.","Idealização do índio como herói medieval.","Sentimentalismo exagerado e temas de morte.","Objetividade científica e determinismo."],c:1,
 p:["Os modernistas queriam romper com o Parnasianismo (rigor formal).","Usaram verso livre, humor, linguagem do cotidiano.","Valorizaram o Brasil de forma crítica (ex.: Manifesto Antropófago, de Oswald de Andrade)."],
 d:"A = Parnasianismo; C = Romantismo (1ª geração); D = Ultrarromantismo; E = Realismo/Naturalismo."},
{a:"lin",m:"Português",t:"Gêneros textuais",
 e:"<div class='texto'>\"Misture a farinha e o açúcar. Acrescente os ovos aos poucos. Leve ao forno preaquecido por 40 minutos.\"</div>O texto pertence a um gênero com qual finalidade principal?",
 o:["Narrar um acontecimento","Opinar sobre um tema polêmico","Instruir o leitor a realizar uma tarefa","Descrever um sentimento","Informar uma notícia"],c:2,
 p:["Verbos no imperativo dando ordens/etapas: 'misture', 'acrescente', 'leve'.","Sequência de passos para alcançar um resultado.","É uma receita → gênero injuntivo/instrucional."],
 d:"Pergunte: para que serve o texto? A FINALIDADE define o gênero."},
{a:"lin",m:"Inglês",t:"Interpretação de texto",
 e:"<div class='texto'>\"Plastic pollution is not only an environmental problem. Microplastics have been found in drinking water, food and even in human blood, raising concerns about long-term health effects.\"</div>The main idea of the text is that plastic pollution:",
 o:["Is only a problem for marine animals.","Can also affect human health.","Has been completely solved.","Is good for drinking water.","Only exists in big cities."],c:1,
 p:["'not only an environmental problem' = não é só um problema ambiental.","'found in drinking water, food and even in human blood' = encontrado em água, comida e até no sangue humano.","'health effects' = efeitos na saúde → a ideia principal é que também afeta a saúde humana."],
 d:"No ENEM, procure as palavras transparentes (pollution, environmental, human) e a ideia central; não traduza palavra por palavra."},
{a:"lin",m:"Espanhol",t:"Interpretação de texto (falsos cognatos)",
 e:"<div class='texto'>\"Ayer fui a la oficina muy temprano, pero estaba cerrada. Tuve que esperar en la calle hasta las nueve.\"</div>De acordo com o texto, a pessoa:",
 o:["Chegou tarde ao escritório.","Encontrou o escritório fechado e esperou na rua.","Foi a uma oficina mecânica consertar o carro.","Esperou dentro do escritório.","Desistiu de esperar."],c:1,
 p:["'oficina' em espanhol = escritório (falso cognato!).","'temprano' = cedo; 'cerrada' = fechada.","'Tuve que esperar en la calle' = teve que esperar na rua."],
 d:"Falsos cognatos famosos: oficina (escritório), exquisito (delicioso), embarazada (grávida), largo (comprido), polvo (pó)."},

/* ---------- QUESTÕES EXTRAS (aulas) ---------- */
{a:"mat",m:"Matemática",t:"Estatística (média ponderada)",
 e:"Em um concurso, a nota final é a média ponderada de três provas: Português (peso 2), Matemática (peso 3) e Redação (peso 5). Um candidato tirou 6, 8 e 5, respectivamente. Qual a nota final?",
 o:["5,9","6,1","6,33","6,5","7,0"],c:1,
 p:["Multiplique cada nota pelo seu peso: 6×2 = 12; 8×3 = 24; 5×5 = 25.","Some os produtos: 12 + 24 + 25 = 61.","Some os pesos: 2 + 3 + 5 = 10.","Média = 61 ÷ 10 = 6,1."],
 d:"6,33 é a média simples (19 ÷ 3). Se a questão fala em 'peso', é ponderada."},
{a:"mat",m:"Matemática",t:"Probabilidade (dois dados)",
 e:"Dois dados comuns são lançados ao mesmo tempo. Qual a probabilidade de a soma dos resultados ser 7?",
 o:["1/12","5/36","1/6","7/36","1/3"],c:2,
 p:["Total de resultados possíveis: 6 × 6 = 36.","Pares com soma 7: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1) → 6 casos.","P = 6/36 = 1/6."],
 d:"(1,6) e (6,1) são casos DIFERENTES — os dados são distintos. Liste os casos com calma."},
{a:"mat",m:"Matemática",t:"Análise combinatória (combinação)",
 e:"De um grupo de 6 alunos, serão escolhidos 3 para formar uma comissão, sem cargos definidos. Quantas comissões diferentes podem ser formadas?",
 o:["18","20","120","216","720"],c:1,
 p:["Na comissão sem cargos, a ordem NÃO importa ({Ana, Bia, Caio} = {Caio, Ana, Bia}) → combinação.","C(6,3) = 6! ÷ (3! · 3!) = (6 × 5 × 4) ÷ (3 × 2 × 1).","= 120 ÷ 6 = 20."],
 d:"120 seria se houvesse cargos (presidente, vice, secretário) — aí a ordem importa."},
{a:"mat",m:"Matemática",t:"Razão e proporção (consumo de combustível)",
 e:"Um carro faz 12 km por litro de gasolina. Para uma viagem de 540 km, com a gasolina a R$ 6,00 o litro, quanto será gasto com combustível?",
 o:["R$ 225,00","R$ 250,00","R$ 270,00","R$ 300,00","R$ 324,00"],c:2,
 p:["Litros necessários: 540 ÷ 12 = 45 L.","Custo: 45 × 6 = R$ 270,00."],
 d:"Monte as etapas: distância → litros → reais. Uma conta por vez."},
{a:"mat",m:"Matemática",t:"Geometria espacial (volume do paralelepípedo)",
 e:"Um aquário tem formato de paralelepípedo com medidas internas de 50 cm × 30 cm × 40 cm. Quantos litros de água cabem nele quando cheio?",
 o:["0,6 L","6 L","60 L","600 L","6 000 L"],c:2,
 p:["V = 50 × 30 × 40 = 60 000 cm³.","1 L = 1 000 cm³ (1 dm³).","60 000 ÷ 1 000 = 60 L."],
 d:"Atalho: converta para dm antes (5 × 3 × 4 = 60 dm³ = 60 L)."},
{a:"nat",m:"Física",t:"Eletricidade (Lei de Ohm e potência)",
 e:"Um secador de cabelo tem as especificações 1 100 W – 220 V. Qual a corrente elétrica que passa por ele em funcionamento?",
 o:["0,2 A","2 A","5 A","10 A","44 A"],c:2,
 p:["Use P = U · i.","1 100 = 220 · i.","i = 1 100 ÷ 220 = 5 A."],
 d:"44 é a resistência (R = U/i = 220/5 = 44 Ω), não a corrente. Leia a unidade pedida."},
{a:"nat",m:"Física",t:"Mecânica (2ª Lei de Newton)",
 e:"Um carro de 1 000 kg sai do repouso e atinge 20 m/s em 10 s, com aceleração constante. Qual a força resultante sobre ele?",
 o:["200 N","2 000 N","10 000 N","20 000 N","200 000 N"],c:1,
 p:["Aceleração: a = Δv ÷ Δt = 20 ÷ 10 = 2 m/s².","F = m · a = 1 000 × 2 = 2 000 N."],
 d:"Primeiro a aceleração, depois a força. Unidades no SI (kg, m/s, s) → resposta em newtons."},
{a:"nat",m:"Química",t:"Mol (quantidade de matéria)",
 e:"Quantas moléculas existem em 36 g de água (H₂O)? Dados: H = 1, O = 16; constante de Avogadro = 6 × 10²³.",
 o:["2","6 × 10²³","1,2 × 10²⁴","3,6 × 10²⁴","1,8 × 10²⁵"],c:2,
 p:["Massa molar da água: 2 × 1 + 16 = 18 g/mol.","Número de mols: 36 ÷ 18 = 2 mol.","Moléculas: 2 × 6 × 10²³ = 12 × 10²³ = 1,2 × 10²⁴."],
 d:"'2' é o número de MOLS, não de moléculas. Cuidado com o que a pergunta pede."},
{a:"nat",m:"Biologia",t:"Genética (grupos sanguíneos)",
 e:"Um homem com sangue tipo AB tem filhos com uma mulher de sangue tipo O. Quais tipos sanguíneos os filhos podem ter?",
 o:["Apenas AB","A, B, AB ou O","Apenas A ou B, com 50% de chance cada","Apenas O","A ou O"],c:2,
 p:["Pai AB → genótipo IᴬIᴮ (pode passar Iᴬ ou Iᴮ).","Mãe O → genótipo ii (só passa i).","Filhos: Iᴬi (tipo A) ou Iᴮi (tipo B) → 1/2 cada.","Nenhum filho pode ser O ou AB."],
 d:"Iᴬ e Iᴮ são dominantes sobre i, e codominantes entre si."},
{a:"nat",m:"Biologia",t:"Ecologia (cadeia alimentar)",
 e:"Em um campo, existe a cadeia: capim → gafanhoto → sapo → cobra. Se as cobras forem caçadas até quase desaparecer, o efeito imediato esperado é:",
 o:["Diminuição dos sapos e aumento dos gafanhotos.","Aumento dos sapos e diminuição dos gafanhotos.","Aumento do capim e dos gafanhotos.","Nenhuma alteração nas populações.","Diminuição de todas as populações."],c:1,
 p:["Sem cobras (predador), os sapos aumentam.","Mais sapos comem mais gafanhotos → gafanhotos diminuem.","Com menos gafanhotos, o capim tende a aumentar (efeito em cascata)."],
 d:"Faça setinhas ↑ e ↓ nível por nível. Os efeitos se alternam ao longo da cadeia."},
{a:"hum",m:"História",t:"República Velha (Revolta da Vacina)",
 e:"Em 1904, a população do Rio de Janeiro se revoltou contra a vacinação obrigatória contra a varíola. Além do medo da vacina, a revolta expressou:",
 o:["Apoio popular à monarquia e ao imperador.","Insatisfação com reformas urbanas autoritárias que expulsaram os pobres do centro da cidade.","Reivindicação pelo fim da escravidão.","Protesto contra o AI-5.","Defesa da industrialização promovida por Vargas."],c:1,
 p:["Contexto: governo Rodrigues Alves; reforma urbana de Pereira Passos ('bota-abaixo') e campanha sanitária de Oswaldo Cruz.","Cortiços foram demolidos e a população pobre foi empurrada para morros e subúrbios.","A vacinação obrigatória, feita de forma autoritária, foi o estopim de uma insatisfação maior."],
 d:"O ENEM gosta de revoltas da República Velha: Canudos, Contestado, Vacina, Chibata."},
{a:"hum",m:"Filosofia",t:"Contratualismo (Locke)",
 e:"\"Sempre que os legisladores tentam tirar e destruir a propriedade do povo, colocam-se em estado de guerra com ele, que fica assim desobrigado de qualquer obediência.\" A ideia central desse pensador é:",
 o:["O poder do soberano deve ser absoluto e indivisível.","O povo tem direito de resistir a um governo que viole seus direitos naturais.","O homem nasce bom e a sociedade o corrompe.","A política deve ser separada da moral.","A luta de classes é o motor da história."],c:1,
 p:["'Propriedade' + 'desobrigado de obediência' → John Locke.","Para Locke, o governo existe para proteger vida, liberdade e propriedade (direitos naturais).","Se o governo os viola, o povo pode resistir (direito de resistência) — base do liberalismo."],
 d:"A = Hobbes; C = Rousseau; D = Maquiavel; E = Marx."},
{a:"hum",m:"Sociologia",t:"Weber (tipos de dominação)",
 e:"Um líder político conquista seguidores fiéis não por causa de leis ou tradições, mas pela crença em suas qualidades extraordinárias e em seu carisma pessoal. Para Max Weber, esse é um exemplo de dominação:",
 o:["Tradicional","Racional-legal","Carismática","Mecânica","Orgânica"],c:2,
 p:["Weber definiu três tipos de dominação legítima.","Tradicional: baseada nos costumes (ex.: monarca). Racional-legal: baseada em leis e cargos (ex.: burocracia).","Carismática: baseada na devoção às qualidades pessoais do líder."],
 d:"Mecânica e orgânica são tipos de SOLIDARIEDADE (Durkheim), não de dominação."},
{a:"hum",m:"Geografia",t:"Clima urbano (inversão térmica)",
 e:"Em dias frios de inverno, é comum São Paulo amanhecer coberta por uma camada de poluição. Isso acontece porque:",
 o:["O ar quente sobe rapidamente, levando os poluentes.","Uma camada de ar quente fica acima de uma camada de ar frio, impedindo a dispersão dos poluentes.","A ilha de calor elimina os poluentes no inverno.","As chuvas de inverno concentram os gases no solo.","Os ventos alísios trazem poluição do litoral."],c:1,
 p:["Normalmente, o ar perto do solo é mais quente e sobe, levando os poluentes.","No inverno, o solo esfria muito à noite → ar frio (mais denso) fica embaixo e o ar quente fica em cima.","Essa 'tampa' de ar quente impede a circulação vertical → os poluentes ficam presos."],
 d:"Inversão térmica: fenômeno natural, mas agravado pela poluição urbana."},
{a:"lin",m:"Português",t:"Funções da linguagem (metalinguagem)",
 e:"<div class='texto'>\"Escrevo este verso / sem saber se é verso. / Procuro a palavra / que diga o que é escrever.\"</div>A função da linguagem predominante no fragmento é:",
 o:["Referencial","Fática","Conativa","Metalinguística","Emotiva"],c:3,
 p:["O poema fala sobre o próprio ato de escrever poemas.","Quando a linguagem se volta para si mesma (o código explicando o código), temos metalinguagem.","Exemplos: poema sobre poesia, filme sobre fazer filmes, verbete de dicionário."],
 d:"Há marcas de 1ª pessoa, mas o FOCO é o próprio fazer poético → metalinguística."},
{a:"lin",m:"Português",t:"Interpretação (ironia)",
 e:"<div class='texto'>\"Que maravilha! Ficamos três horas presos no trânsito e ainda chegamos atrasados à reunião.\"</div>O efeito de sentido do trecho é construído principalmente por meio de:",
 o:["Hipérbole, pois exagera o tempo no trânsito.","Ironia, pois 'Que maravilha!' expressa o contrário do que o falante sente.","Metáfora, pois compara o trânsito a uma prisão.","Eufemismo, pois suaviza o atraso.","Antítese, pois opõe trânsito e reunião."],c:1,
 p:["A situação descrita é ruim (trânsito + atraso).","Mas o falante diz 'Que maravilha!'.","Dizer o contrário do que se pensa, para criticar ou fazer humor = ironia."],
 d:"Ironia é muito cobrada em charges e tirinhas: compare o que é DITO com a SITUAÇÃO."},
{a:"lin",m:"Inglês",t:"Interpretação (conectivos em inglês)",
 e:"<div class='texto'>\"Social media can connect people from different countries. However, excessive use may lead to anxiety and isolation.\"</div>The word \"However\" introduces an idea of:",
 o:["Addition","Contrast","Conclusion","Example","Time"],c:1,
 p:["1ª frase: aspecto positivo (conecta pessoas).","2ª frase: aspecto negativo (ansiedade e isolamento).","'However' = 'no entanto' → contraste/oposição."],
 d:"Conectivos em inglês: however/but/although (contraste), moreover/also (adição), therefore/so (conclusão)."},

/* ---------- REDAÇÃO (exercícios) ---------- */
{a:"red",m:"Redação",t:"Tese",
 e:"Tema: <b>\"Desafios para combater a desinformação nas redes sociais no Brasil\"</b>. Qual frase funciona melhor como TESE no final da introdução?",
 o:["\"A internet é a pior invenção da humanidade.\"","\"Esse problema persiste devido à baixa educação midiática da população e à lógica dos algoritmos, que favorecem conteúdos sensacionalistas.\"","\"Eu acho que as fake news são muito ruins para todos.\"","\"Neste texto, vou falar sobre as fake news.\"","\"As redes sociais deveriam ser proibidas no Brasil.\""],c:1,
 p:["Uma boa tese mostra o seu ponto de vista E anuncia os dois argumentos que serão desenvolvidos.","B cita duas causas (educação midiática e algoritmos) → já organiza os dois parágrafos de desenvolvimento.","A e E são radicais; C usa 1ª pessoa e é vaga; D é metalinguagem ('vou falar sobre')."],
 d:"Fórmula da tese: 'Isso ocorre devido a [causa 1] e a [causa 2].'"},
{a:"red",m:"Redação",t:"Proposta de intervenção",

{a:"red",m:"Redação",t:"Repertório produtivo",

 o:["\"Como dizia Einstein, a imaginação é mais importante que o conhecimento.\"","\"A Lei 10.639/2003 tornou obrigatório o ensino de cultura afro-brasileira; contudo, muitas escolas ainda a aplicam de forma superficial, o que mantém o apagamento dessas contribuições.\"","\"Segundo Aristóteles, o homem é um animal político.\"","\"O Brasil é um país muito grande.\"","\"De acordo com estudos, isso é um problema.\""],c:1,

{a:"red",m:"Redação",t:"O que zera a redação",

{a:"red",m:"Redação",t:"Recorte temático",

/* ===================== AULAS (estilo cursinho) ===================== */
const AULAS = [
/* MATEMÁTICA */
{id:"porc",a:"mat",titulo:"Porcentagem, aumentos, descontos e juros",
 teoria:`Porcentagem é uma fração de denominador 100: <span class="f">25% = 25/100 = 0,25</span>. O segredo do ENEM é trabalhar com o <b>fator multiplicativo</b>: aumento de p% → ×(1 + p/100); desconto de p% → ×(1 − p/100). Juros simples crescem sempre sobre o valor inicial; juros compostos crescem "juros sobre juros".`,
 metodo:["Descubra a BASE: o valor de antes (é sobre ele que se calcula a porcentagem).","Transforme cada aumento/desconto em fator (×1,10, ×0,85…).","Em mudanças sucessivas, MULTIPLIQUE os fatores, nunca some as porcentagens.","Releia a pergunta: ela quer o valor final, o quanto aumentou ou a porcentagem?"],
 ex:{e:"Um salário de R$ 2 000 teve dois aumentos seguidos de 10%. Qual o salário final?",p:["Fator: 1,10 × 1,10 = 1,21.","2 000 × 1,21 = R$ 2 420 (e não R$ 2 400!).","O aumento total foi de 21%, não de 20%."]},
 erros:["Somar porcentagens sucessivas.","Calcular a variação sobre o valor novo em vez do antigo.","Confundir pontos percentuais com porcentagem: taxa de 10% para 12% subiu 2 pontos percentuais, mas 20% em relação a ela mesma."]},
{id:"prop",a:"mat",titulo:"Razão, proporção, regra de três e escala",
 teoria:`Razão compara duas grandezas (ex.: km por litro, habitantes por km²). Duas grandezas são <b>diretamente proporcionais</b> quando uma aumenta e a outra aumenta na mesma proporção; <b>inversamente</b> quando uma aumenta e a outra diminui (operários × dias, velocidade × tempo). Escala é uma razão: <span class="f">desenho : real</span>.`,
 metodo:["Organize as grandezas em colunas com as mesmas unidades.","Pergunte: se uma aumenta, a outra aumenta (direta) ou diminui (inversa)?","Direta: multiplique em cruz. Inversa: o produto é constante (a·b = c·d).","Em escala: real = desenho × denominador; depois converta a unidade."],
 ex:{e:"Uma planta está na escala 1:50. Uma sala mede 8 cm × 6 cm no papel. Qual a área real?",p:["Medidas reais: 8 × 50 = 400 cm = 4 m; 6 × 50 = 300 cm = 3 m.","Área: 4 × 3 = 12 m².","Cuidado: a área NÃO se multiplica por 50, e sim por 50² (calcule sempre pelas medidas)."]},
 erros:["Usar regra de três direta quando é inversa.","Esquecer de converter cm em m ou km.","Multiplicar a área pela escala linear."]},
{id:"est",a:"mat",titulo:"Estatística e leitura de gráficos",
 teoria:`É um dos temas que mais caem. Média = soma ÷ quantidade. Média ponderada = Σ(valor × peso) ÷ Σ(pesos). Mediana = termo do meio com os dados <b>em ordem</b>. Moda = valor mais frequente. Em gráficos, leia o <b>título, os eixos, as unidades e a legenda</b> antes de tudo.`,
 metodo:["Leia o título e as unidades do gráfico/tabela (mil? milhões? %?).","Para mediana: ORDENE os dados. Quantidade ímpar → o do meio; par → média dos dois do meio.","Para média ponderada: multiplique pelo peso, some, divida pela soma dos pesos.","Confira se a resposta faz sentido (a média sempre fica entre o menor e o maior valor)."],
 ex:{e:"Gols de um time em 5 jogos: 3, 0, 2, 5, 2. Calcule média, mediana e moda.",p:["Média: (3+0+2+5+2) ÷ 5 = 12 ÷ 5 = 2,4.","Ordenando: 0, 2, 2, 3, 5 → mediana = 2 (o 3º valor).","Moda = 2 (aparece duas vezes)."]},
 erros:["Calcular a mediana sem ordenar.","Ignorar a unidade do eixo (ex.: 'em milhares').","Usar média simples quando há pesos."]},
{id:"prob",a:"mat",titulo:"Probabilidade e análise combinatória",
 teoria:`Probabilidade = casos favoráveis ÷ casos possíveis. "E" → multiplica; "OU" → soma (se não puderem acontecer juntos). Na contagem, use o <b>princípio multiplicativo</b>: multiplique as opções de cada etapa. Se a ordem NÃO importa (grupos, comissões), divida pelas repetições → combinação.`,
 metodo:["Pergunte: a ordem importa? (senha, fila, cargos = sim; grupo, salada de frutas = não).","Conte etapa por etapa e multiplique.","Se a ordem não importa, use C(n,p) = n!/(p!(n−p)!).","Em probabilidade, verifique se é COM ou SEM reposição."],
 ex:{e:"Uma lanchonete oferece 3 tipos de pão, 4 recheios e 2 molhos. Quantos lanches diferentes (1 de cada) podem ser montados?",p:["Etapas independentes: pão, recheio, molho.","3 × 4 × 2 = 24 lanches."]},
 erros:["Usar combinação quando a ordem importa (ou vice-versa).","Esquecer que sem reposição o total diminui.","Contar (1,6) e (6,1) como um só caso nos dados."]},
{id:"func",a:"mat",titulo:"Funções e sequências",
 teoria:`Função do 1º grau <span class="f">f(x) = ax + b</span>: <b>b</b> é o valor fixo (bandeirada, taxa) e <b>a</b> é quanto aumenta por unidade. Gráfico: reta. Função do 2º grau <span class="f">f(x) = ax² + bx + c</span>: gráfico é parábola; o ponto de máximo/mínimo é o vértice (x<sub>v</sub> = −b/2a). PA soma uma razão constante; PG multiplica.`,
 metodo:["Identifique o valor fixo e o valor que varia.","Monte a função com as informações do texto.","Para máximo/mínimo: calcule x do vértice e depois substitua para achar y.","Em sequências, escreva os primeiros termos e descubra o padrão (soma → PA; multiplica → PG)."],
 ex:{e:"Uma academia cobra R$ 50 de matrícula + R$ 80 por mês. Quanto custa um ano?",p:["f(x) = 50 + 80x.","f(12) = 50 + 960 = R$ 1 010."]},
 erros:["Responder o x do vértice quando a pergunta quer o valor máximo (y).","Esquecer o valor fixo.","Em PA, usar n em vez de (n − 1)."]},
{id:"geo",a:"mat",titulo:"Geometria plana e espacial",
 teoria:`Área mede superfície (m²), volume mede espaço (m³). Prismas e cilindros: <span class="f">V = área da base × altura</span>. Pirâmides e cones: um terço disso. Lembre: <b>1 m³ = 1 000 L</b> e <b>1 dm³ = 1 L</b>. Pitágoras: em triângulo retângulo, hipotenusa² = cateto² + cateto².`,
 metodo:["Desenhe a figura e anote as medidas.","Coloque TODAS as medidas na mesma unidade.","Escolha a fórmula (área? volume?).","Converta o resultado para a unidade pedida (litros, m², peças…)."],
 ex:{e:"Uma piscina de 8 m × 4 m × 1,5 m. Quantos litros cabem?",p:["V = 8 × 4 × 1,5 = 48 m³.","48 × 1 000 = 48 000 L."]},
 erros:["Misturar cm e m na mesma conta.","Confundir raio com diâmetro.","Esquecer de dividir por 3 em cones e pirâmides."]},
/* NATUREZA */
{id:"ele",a:"nat",titulo:"Eletricidade no dia a dia",
 teoria:`Potência (W) indica quanta energia o aparelho gasta por segundo. Consumo na conta de luz: <span class="f">E (kWh) = P (kW) × t (h)</span>. Relações: <span class="f">P = U·i</span> e <span class="f">U = R·i</span>. Em casa, os aparelhos são ligados em <b>paralelo</b> (mesma tensão, funcionam independentes).`,
 metodo:["Passe a potência para kW (÷ 1 000) e o tempo para horas (÷ 60).","Calcule o consumo E = P × t.","Multiplique pelo preço do kWh se a questão pedir o custo.","Para corrente: i = P/U. Para resistência: R = U/i."],
 ex:{e:"Uma lâmpada de 10 W fica acesa 6 h por dia durante 30 dias. Qual o consumo?",p:["P = 0,01 kW; t = 6 × 30 = 180 h.","E = 0,01 × 180 = 1,8 kWh."]},
 erros:["Usar W e minutos direto na fórmula.","Achar que paralelo divide a tensão.","Confundir corrente (A) com resistência (Ω)."]},
{id:"fis",a:"nat",titulo:"Mecânica, energia, ondas, calor e óptica",
 teoria:`Velocidade média = distância total ÷ tempo total (com paradas). Força: <span class="f">F = m·a</span>. Energia se conserva: potencial (m·g·h) vira cinética (m·v²/2). Ondas: <span class="f">v = λ·f</span>. Calor: <span class="f">Q = m·c·ΔT</span>. Visão: miopia → lente divergente; hipermetropia → convergente.`,
 metodo:["Liste os dados com unidades no SI (m, s, kg).","Identifique o fenômeno (movimento? energia? onda? calor?).","Escolha a fórmula e isole o que se pede.","Confira a unidade da resposta."],
 ex:{e:"Uma moto percorre 60 km em 30 min. Qual a velocidade média em km/h?",p:["30 min = 0,5 h.","v = 60 ÷ 0,5 = 120 km/h."]},
 erros:["Esquecer o tempo de parada.","Não converter MHz, km/h etc.","Achar que objetos mais pesados caem mais rápido (sem ar, caem igual)."]},
{id:"qui1",a:"nat",titulo:"Mol, estequiometria e soluções",
 teoria:`Mol é a "dúzia" da química: <b>1 mol = 6 × 10²³ partículas</b>. Massa molar = soma das massas atômicas (g/mol). Estequiometria usa a proporção dos coeficientes da equação balanceada. Concentração comum: <span class="f">C = m/V</span> (g/L). Diluição: <span class="f">C₁V₁ = C₂V₂</span>.`,
 metodo:["Confira se a equação está balanceada.","Converta a massa dada em mol (÷ massa molar).","Use a proporção dos coeficientes.","Converta o resultado para o que se pede (massa, volume, moléculas)."],
 ex:{e:"Quantos gramas de NaOH (40 g/mol) há em 2 L de solução 0,5 mol/L?",p:["n = 0,5 × 2 = 1 mol.","m = 1 × 40 = 40 g."]},
 erros:["Pular a conversão para mol.","Esquecer de balancear a equação.","Achar que a diluição muda a massa de soluto."]},
{id:"qui2",a:"nat",titulo:"Química ambiental, pH, misturas, pilhas e radioatividade",
 teoria:`Química no cotidiano é o forte do ENEM. Chuva ácida (SO₂, NOₓ); efeito estufa (CO₂, CH₄); pH (escala logarítmica: cada 1 unidade = 10×); separação de misturas; pilhas (ânodo oxida, cátodo reduz); meia-vida (cai pela metade a cada período).`,
 metodo:["Identifique o fenômeno do texto (poluição? ácido/base? pilha? radiação?).","Lembre a regra-chave do assunto (macetes abaixo).","Elimine alternativas que confundem conceitos (ex.: CO₂ como causador da chuva ácida).","Em meia-vida, faça a 'escadinha' dividindo por 2."],
 ex:{e:"Um solo muito ácido prejudica a plantação. O que o agricultor pode adicionar para corrigi-lo?",p:["Ácido se neutraliza com base.","Usa-se calcário (CaCO₃) — a 'calagem' — que eleva o pH do solo."]},
 erros:["Achar que pH 2 é 'um pouco' mais ácido que pH 3 (é 10 vezes).","Usar filtração para separar sal da água.","Inverter ânodo e cátodo."]},
{id:"gen",a:"nat",titulo:"Genética",
 teoria:`Cada característica é determinada por um par de genes (alelos), um vindo do pai e outro da mãe. Dominante (A) se manifesta mesmo com um alelo; recessivo (a) só em dose dupla (aa). Aa × Aa → 1/4 AA, 1/2 Aa, 1/4 aa. Grupos sanguíneos: Iᴬ e Iᴮ dominam i.`,
 metodo:["Descubra os genótipos dos pais (pista: pais normais com filho afetado → ambos Aa).","Faça o quadro de Punnett.","Calcule a probabilidade do que se pede.","Se pedir o sexo, multiplique por 1/2. Se o indivíduo já é sabidamente normal, a chance de ser Aa é 2/3."],
 ex:{e:"Pais normais têm um filho albino. Qual a chance do próximo filho ser normal?",p:["Filho aa → pais obrigatoriamente Aa × Aa.","Normal = AA ou Aa = 3/4."]},
 erros:["Esquecer de multiplicar por 1/2 quando pede 'menino' ou 'menina'.","Usar 1/2 em vez de 2/3 quando o indivíduo já é normal.","Achar que o resultado de um filho influencia o próximo."]},
{id:"eco",a:"nat",titulo:"Ecologia, evolução e saúde",
 teoria:`Cadeia alimentar: a energia diminui a cada nível; poluentes não degradáveis se acumulam no topo. Relações: mutualismo (+/+), parasitismo (+/−), comensalismo (+/0), competição (−/−). Evolução por seleção natural (Darwin): o ambiente seleciona variações que já existem. Vacina previne (ativa); soro trata (passiva).`,
 metodo:["Identifique os seres e seus papéis (produtor, consumidor, decompositor).","Use setas ↑ ↓ para prever efeitos em cadeia.","Em evolução, desconfie de 'para se adaptar' e 'porque precisava' (lamarckismo).","Em saúde, pergunte: é prevenção (vacina) ou tratamento (soro, remédio)?"],
 ex:{e:"Por que pernilongos ficaram resistentes a um inseticida usado por anos?",p:["Alguns já eram resistentes por variação genética.","O inseticida matou os sensíveis; os resistentes sobreviveram e se reproduziram.","É seleção natural, não 'adaptação por necessidade'."]},
 erros:["Achar que a energia aumenta subindo a cadeia.","Explicações lamarckistas em evolução.","Confundir vacina e soro."]},
/* HUMANAS */
{id:"hist",a:"hum",titulo:"História: como resolver + Brasil República",
 teoria:`O ENEM cobra História relacionando passado e presente, com foco em cidadania, trabalho, escravidão e suas heranças, Era Vargas, Ditadura e Redemocratização. Quase sempre há um texto-base: a resposta é <b>a que conecta o texto ao contexto histórico</b>.`,
 metodo:["Leia o COMANDO primeiro (o que pede: causa? consequência? objetivo?).","No texto, sublinhe data, autor, lugar e palavras-chave.","Situe no tempo: que período é esse? O que acontecia?","Elimine: anacronismos (fatos de outra época), afirmações absolutas ('sempre', 'nunca') e alternativas que contradizem o texto.","Escolha a que RESPONDE ao comando — não apenas a que é 'verdadeira'."],
 ex:{e:"Um texto de 1943 fala em carteira de trabalho, férias e salário mínimo. Qual o contexto?",p:["1943 → Estado Novo (Era Vargas).","Direitos trabalhistas → CLT.","Contexto: trabalhismo, controle dos sindicatos pelo Estado."]},
 erros:["Responder pelo que você 'acha' e não pelo texto.","Escolher alternativa verdadeira, mas que não responde à pergunta.","Anacronismo."]},
{id:"filo",a:"hum",titulo:"Filosofia e Sociologia",
 teoria:`Aqui o ENEM dá um trecho e pede a ideia do autor. Decore a "palavra-chave" de cada pensador (veja o Resumão): Hobbes = medo/segurança; Locke = propriedade/resistência; Rousseau = bondade natural/vontade geral; Durkheim = fato social; Weber = ação social/dominação; Marx = luta de classes; Frankfurt = indústria cultural.`,
 metodo:["Encontre a palavra-chave do trecho.","Associe ao autor (mesmo que o nome não apareça).","Elimine alternativas que trazem ideias de OUTROS autores (são os distratores).","Confirme que a alternativa é coerente com o trecho."],
 ex:{e:"\"O homem nasce livre, e por toda parte encontra-se a ferros.\" Quem é o autor?",p:["Liberdade natural corrompida pela sociedade → Rousseau.","Ideia ligada ao contrato social e à vontade geral."]},
 erros:["Confundir os contratualistas.","Confundir solidariedade (Durkheim) com dominação (Weber)."]},
{id:"geo2",a:"hum",titulo:"Geografia",
 teoria:`Temas campeões: questões ambientais (desmatamento, clima urbano, recursos hídricos), urbanização e segregação, agropecuária e fronteira agrícola, globalização, energia e cartografia. O ENEM valoriza a relação <b>sociedade × natureza</b> e as desigualdades.`,
 metodo:["Identifique se é tema físico (clima, relevo) ou humano (cidade, economia) — ou os dois.","Procure causa e consequência no texto/gráfico.","Prefira alternativas que mostram relações (ex.: impermeabilização → enchente).","Desconfie de soluções simplistas ou que culpam só a natureza."],
 ex:{e:"Por que as enchentes são mais graves nas grandes cidades?",p:["Solo impermeabilizado (asfalto) → a água não infiltra.","Rios canalizados e ocupação das várzeas.","Lixo entupindo bueiros → o escoamento falha."]},
 erros:["Confundir ilha de calor com inversão térmica.","Atribuir problemas urbanos só a 'excesso de chuva'."]},
/* LINGUAGENS */
{id:"interp",a:"lin",titulo:"Interpretação de texto, gêneros e figuras",
 teoria:`Linguagens é a prova de <b>leitura</b>. A resposta está no texto. Pergunte sempre: <b>quem fala, para quem, com que objetivo e em que gênero?</b> Estude funções da linguagem, variação linguística, figuras e conectivos (veja o Resumão).`,
 metodo:["Leia o comando antes do texto.","Identifique o gênero (charge, notícia, poema, anúncio…) e a finalidade.","Procure no texto a prova da alternativa (sublinhe!).","Elimine alternativas que extrapolam (dizem mais que o texto), reduzem ou contradizem.","Desconfie de alternativas preconceituosas sobre a língua."],
 ex:{e:"Uma charge mostra um homem dizendo 'Que calor agradável!' no meio de um incêndio florestal. Qual o efeito?",p:["O que é dito ('agradável') contradiz a situação (incêndio).","Isso é ironia, usada para criticar o descaso ambiental."]},
 erros:["Responder com conhecimento de fora, ignorando o texto.","Escolher alternativas que generalizam ('todos', 'sempre')."]},
{id:"lingua",a:"lin",titulo:"Inglês e Espanhol",
 teoria:`São 5 questões de leitura. Não é preciso saber traduzir tudo: busque <b>palavras transparentes</b>, o título, a fonte e a ideia central. Muitas vezes o comando e as alternativas estão em português.`,
 metodo:["Leia o comando e as alternativas primeiro (sabendo o que procurar).","Leia o título e a fonte do texto.","Marque palavras conhecidas e cognatas.","Atenção aos conectivos (however, but, so) e aos falsos cognatos (no espanhol: oficina, exquisito, embarazada)."],
 ex:{e:"'Pretend' em inglês significa:",p:["Falso cognato! Não é 'pretender'.","Significa 'fingir'. ('Pretender' = intend.)"]},
 erros:["Traduzir palavra por palavra.","Cair em falsos cognatos."]}
];
