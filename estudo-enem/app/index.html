     {e:"Problema: um número somado ao seu dobro dá 45. Qual é o número?",s:["Número = x; dobro = 2x.","x + 2x = 45 → 3x = 45","<b>x = 15</b>"]}],
 m:"Para equação com frações (x/2 + x/3 = 10), multiplique TUDO pelo MMC dos denominadores e as frações somem.",
 tr:[{e:"5x − 7 = 18",r:["5x = 25","x = 5"]},{e:"4(x + 1) = 2x + 10",r:["4x + 4 = 2x + 10","2x = 6","x = 3"]},{e:"x/2 + x/3 = 10",r:["MMC(2,3) = 6. Multiplique tudo por 6:","3x + 2x = 60","5x = 60 → x = 12"]}]},

{g:"🔢 Matemática básica", t:"Equação do 2º grau (Bhaskara)", q:"Áreas (x · (x + 3) = 40), lançamentos, lucro, problemas com produto de números.",
 p:["Deixe na forma <span class='f'>ax² + bx + c = 0</span> e identifique a, b e c (com os sinais!).","Calcule o discriminante: <span class='f'>Δ = b² − 4ac</span>.","Δ &gt; 0: duas raízes; Δ = 0: uma raiz; Δ &lt; 0: nenhuma raiz real.","Aplique: <span class='f'>x = (−b ± √Δ) ÷ 2a</span>.","Em problemas, descarte respostas que não fazem sentido (medida negativa, por exemplo)."],
 ex:[{e:"x² − 5x + 6 = 0",s:["a = 1, b = −5, c = 6","Δ = (−5)² − 4·1·6 = 25 − 24 = 1","x = (5 ± 1) ÷ 2","x₁ = 6/2 = <b>3</b> e x₂ = 4/2 = <b>2</b>"]},
     {e:"Um terreno retangular tem um lado 3 m maior que o outro e área de 40 m². Quanto mede o menor lado?",s:["x · (x + 3) = 40 → x² + 3x − 40 = 0","Δ = 9 + 160 = 169 → √Δ = 13","x = (−3 ± 13) ÷ 2 → x = 5 ou x = −8","Medida não pode ser negativa → <b>5 m</b>"]},
     {e:"Equações incompletas (mais rápido, sem Bhaskara)",s:["x² − 9 = 0 → x² = 9 → x = ±3","x² − 5x = 0 → x(x − 5) = 0 → x = 0 ou x = 5"]}],
 m:"Atalho: soma das raízes = −b/a e produto = c/a. Em x² − 5x + 6 = 0, procure dois números que somam 5 e multiplicam 6 → 2 e 3.",
 tr:[{e:"x² − 7x + 10 = 0",r:["Soma 7, produto 10 → 2 e 5","(Ou: Δ = 49 − 40 = 9; x = (7 ± 3)/2)"]},{e:"x² − 16 = 0",r:["x² = 16","x = 4 ou x = −4"]},{e:"x² + 6x + 9 = 0",r:["Δ = 36 − 36 = 0 → uma raiz","x = −6/2 = −3"]}]},

{g:"🔢 Matemática básica", t:"Sistema de equações", q:"Ingressos de inteira e meia, galinhas e coelhos, dois produtos com preços diferentes.",
 p:["Dê nome às incógnitas (x = …, y = …).","Monte UMA equação para cada informação do texto.","<b>Método da adição:</b> some (ou subtraia) as equações para cancelar uma letra.","<b>Método da substituição:</b> isole uma letra em uma equação e substitua na outra.","Ache uma letra e volte para achar a outra."],
 ex:[{e:"x + y = 10 e x − y = 4",s:["Somando as duas: 2x = 14 → x = 7","Volta: 7 + y = 10 → y = 3"]},
     {e:"Um show vendeu 50 ingressos: inteira R$ 20 e meia R$ 10. Arrecadou R$ 700. Quantas inteiras?",s:["x = inteiras, y = meias","x + y = 50 e 20x + 10y = 700","Da 1ª: y = 50 − x. Substitui: 20x + 10(50 − x) = 700","20x + 500 − 10x = 700 → 10x = 200 → <b>x = 20 inteiras</b> (e 30 meias)"]}],
 m:"Sempre confira a resposta nas DUAS equações.",
 tr:[{e:"2x + y = 11 e x − y = 1",r:["Somando: 3x = 12 → x = 4","4 − y = 1 → y = 3"]},{e:"Num quintal há galinhas e coelhos: 20 cabeças e 56 patas. Quantos coelhos?",r:["g + c = 20 e 2g + 4c = 56","Multiplique a 1ª por 2: 2g + 2c = 40","Subtraia: 2c = 16 → c = 8 coelhos (e 12 galinhas)"]}]},

{g:"🔢 Matemática básica", t:"Frações", q:"Receitas, divisão de herança/bolo, probabilidade, escalas.",
 p:["<b>Simplificar:</b> divida em cima e embaixo pelo mesmo número (6/8 = 3/4).","<b>Somar/subtrair:</b> deixe os denominadores iguais (MMC) e opere só os numeradores.","<b>Multiplicar:</b> em cima × em cima, embaixo × embaixo.","<b>Dividir:</b> mantenha a 1ª e multiplique pelo INVERSO da 2ª.","<b>Fração de um valor:</b> 3/4 de 80 → 80 ÷ 4 × 3 = 60."],
 ex:[{e:"1/2 + 1/3",s:["MMC(2,3) = 6","3/6 + 2/6 = <b>5/6</b>"]},{e:"2/3 ÷ 4/5",s:["2/3 × 5/4 = 10/12","Simplificando: <b>5/6</b>"]}],
 m:"'De' em matemática quase sempre significa multiplicação: metade DE 30 = 1/2 × 30.",
 tr:[{e:"3/4 − 1/6",r:["MMC = 12","9/12 − 2/12 = 7/12"]},{e:"2/5 de 150",r:["150 ÷ 5 = 30","30 × 2 = 60"]},{e:"5/6 × 3/10",r:["15/60","= 1/4"]}]},

{g:"🔢 Matemática básica", t:"Porcentagem de cabeça (sem calculadora)", q:"Praticamente toda prova! Descontos, impostos, gráficos.",
 p:["<b>10%</b> → divida por 10 (ande a vírgula 1 casa).","<b>1%</b> → divida por 100.","<b>5%</b> → metade de 10%. <b>20%</b> → dobro de 10% (ou ÷ 5). <b>25%</b> → ÷ 4. <b>50%</b> → ÷ 2.","Monte as outras somando: 15% = 10% + 5%; 35% = 3 × 10% + 5%.","Truque: x% de y = y% de x (8% de 50 = 50% de 8 = 4)."],
 ex:[{e:"15% de 240",s:["10% = 24","5% = 12","15% = 24 + 12 = <b>36</b>"]}],
 m:"Para achar o preço ANTES de um aumento de 20% que resultou em R$ 120: divida 120 por 1,20 = R$ 100 (não tire 20% de 120!).",
 tr:[{e:"35% de 80",r:["10% = 8 → 30% = 24","5% = 4","35% = 28"]},{e:"4% de 25",r:["= 25% de 4","= 1"]},{e:"Um produto custa R$ 90 após um desconto de 10%. Qual era o preço original?",r:["90 ÷ 0,90","= R$ 100"]}]},

{g:"🔢 Matemática básica", t:"Potências e notação científica", q:"Distâncias astronômicas, tamanho de células e vírus, Química (mol) e Física.",
 p:["a<sup>m</sup> · a<sup>n</sup> = a<sup>m+n</sup> (multiplicação: soma os expoentes).","a<sup>m</sup> ÷ a<sup>n</sup> = a<sup>m−n</sup> (divisão: subtrai).","(a<sup>m</sup>)<sup>n</sup> = a<sup>m·n</sup>; a<sup>0</sup> = 1; a<sup>−n</sup> = 1/a<sup>n</sup>.","Notação científica: N × 10<sup>k</sup>, com N entre 1 e 10.","Andou a vírgula para a ESQUERDA → o expoente AUMENTA; para a DIREITA → DIMINUI."],
 ex:[{e:"0,00045 em notação científica",s:["Ande a vírgula 4 casas para a direita → 4,5","<b>4,5 × 10⁻⁴</b>"]},{e:"(3 × 10⁸) × (2 × 10⁻³)",s:["Números: 3 × 2 = 6","Potências: 10⁸⁺⁽⁻³⁾ = 10⁵","<b>6 × 10⁵</b>"]}],
 m:"Multiplique os números com os números e as potências de 10 com as potências de 10.",
 tr:[{e:"52 000 000 em notação científica",r:["5,2 × 10⁷"]},{e:"(4 × 10⁶) ÷ (2 × 10²)",r:["4 ÷ 2 = 2","10⁶⁻² = 10⁴","2 × 10⁴"]},{e:"2³ · 2⁴",r:["2⁷ = 128"]}]},

{g:"🔢 Matemática básica", t:"Raiz quadrada", q:"Pitágoras, Bhaskara, velocidade em queda livre, área de quadrados.",
 p:["Decore os quadrados perfeitos: 1, 4, 9, 16, 25, 36, 49, 64, 81, 100, 121, 144, 169, 196, 225.","Para simplificar, separe um quadrado perfeito: √50 = √(25 · 2) = 5√2.","Para estimar: √20 está entre √16 = 4 e √25 = 5 → ≈ 4,5.","√(a/b) = √a / √b."],
 ex:[{e:"√72",s:["72 = 36 · 2","√72 = 6√2 ≈ 6 × 1,41 ≈ 8,5"]}],
 m:"Valores úteis: √2 ≈ 1,41 e √3 ≈ 1,73.",
 tr:[{e:"√48",r:["48 = 16 · 3","= 4√3"]},{e:"√0,25",r:["= 0,5 (porque 0,5 × 0,5 = 0,25)"]},{e:"√(16/9)",r:["= 4/3"]}]},

{g:"🔢 Matemática básica", t:"Regra de três composta", q:"Máquinas × dias × peças; operários × horas × dias.",
 p:["Monte uma tabela com uma coluna para cada grandeza; marque o x.","Compare CADA grandeza com a do x: direta ou inversa?","Diretas: a razão fica como está. Inversas: inverta a razão.","x = valor conhecido × (produto das razões)."],
 ex:[{e:"4 máquinas fazem 200 peças em 5 dias. Quantas peças 6 máquinas fazem em 8 dias?",s:["Mais máquinas → mais peças (direta). Mais dias → mais peças (direta).","x = 200 × (6/4) × (8/5)","x = 200 × 1,5 × 1,6 = <b>480 peças</b>"]}],
 m:"Método do 'total de trabalho': 10 operários × 8 h × 6 dias = 480 'operário-horas'. Com 12 operários a 5 h/dia: 480 ÷ (12 × 5) = 8 dias.",
 tr:[{e:"10 operários, trabalhando 8 h/dia, fazem uma obra em 6 dias. Em quantos dias 12 operários, trabalhando 5 h/dia, fazem a mesma obra?",r:["Total de trabalho: 10 × 8 × 6 = 480","Por dia agora: 12 × 5 = 60","480 ÷ 60 = 8 dias"]}]},

{g:"🔢 Matemática básica", t:"Conversão de unidades", q:"Volume em litros, escalas, velocidade, área de terrenos.",
 p:["Escadinha: <b>km → hm → dam → m → dm → cm → mm</b>. Cada degrau para a direita: ×10.","Área (m²): cada degrau ×100. Volume (m³): cada degrau ×1000.","<b>1 dm³ = 1 L</b>; <b>1 m³ = 1000 L</b>; <b>1 cm³ = 1 mL</b>.","Velocidade: km/h ÷ 3,6 = m/s; m/s × 3,6 = km/h.","Tempo: 1 h = 60 min = 3600 s. Cuidado: 1,5 h = 1 h 30 min (não 1 h 50 min!)."],
 ex:[{e:"72 km/h em m/s",s:["72 ÷ 3,6 = <b>20 m/s</b>"]},{e:"2 m² em cm²",s:["m → cm: 2 degraus; área: ×100 em cada","2 × 100 × 100 = <b>20 000 cm²</b>"]}],
 m:"1 hectare = 10 000 m² (um quadrado de 100 m × 100 m).",
 tr:[{e:"2,5 m³ em litros",r:["2,5 × 1000 = 2500 L"]},{e:"10 m/s em km/h",r:["10 × 3,6 = 36 km/h"]},{e:"0,45 m em cm",r:["0,45 × 100 = 45 cm"]}]},

{g:"🔢 Matemática básica", t:"Trigonometria (SOH-CAH-TOA)", q:"Rampas, escadas, altura de prédios e árvores, sombra.",
 p:["Identifique o ângulo e os lados: hipotenusa (oposta ao ângulo reto), cateto oposto e cateto adjacente ao ângulo.","<b>sen = oposto ÷ hipotenusa</b>; <b>cos = adjacente ÷ hipotenusa</b>; <b>tg = oposto ÷ adjacente</b>.","Escolha a razão que liga o que você TEM com o que você QUER.","Use a tabela dos ângulos notáveis."],
 ex:[{e:"Uma rampa de 10 m forma 30° com o chão. Qual a altura alcançada?",s:["Tenho a hipotenusa (10), quero o oposto (altura) → seno.","sen 30° = h/10 → 1/2 = h/10","<b>h = 5 m</b>"]}],
 m:"Tabela: sen 30° = 1/2, sen 45° = √2/2, sen 60° = √3/2. Cosseno é a ordem inversa (√3/2, √2/2, 1/2). tg 30° = √3/3, tg 45° = 1, tg 60° = √3.",
 tr:[{e:"Uma escada de 8 m forma 60° com o chão. A que distância da parede está o pé da escada?",r:["Tenho a hipotenusa, quero o adjacente → cosseno","cos 60° = d/8 → 1/2 = d/8","d = 4 m"]},{e:"De 20 m de distância, uma pessoa vê o topo de um prédio sob um ângulo de 45°. Qual a altura do prédio (desprezando a altura dos olhos)?",r:["Tenho o adjacente, quero o oposto → tangente","tg 45° = h/20 → 1 = h/20","h = 20 m"]}]},

{g:"🔢 Matemática básica", t:"Exponencial e logaritmo", q:"Crescimento de bactérias, juros, meia-vida, escala Richter, pH.",
 p:["Exponencial: algo que dobra/triplica em períodos fixos → N = N₀ · 2<sup>t</sup>.","Logaritmo é a pergunta: 'a que expoente eu elevo a base para chegar ao número?' → log₂ 8 = 3, porque 2³ = 8.","Propriedades: log(a·b) = log a + log b; log(a/b) = log a − log b; log aⁿ = n · log a.","log 10 = 1; log 1 = 0; log 100 = 2; log 1000 = 3."],
 ex:[{e:"100 bactérias dobram a cada 20 minutos. Quantas haverá após 2 horas?",s:["2 h = 120 min → 120 ÷ 20 = 6 períodos","N = 100 × 2⁶ = 100 × 64 = <b>6 400</b>"]}],
 m:"Se a questão dá log 2 ≈ 0,3, use: log 4 = 0,6; log 8 = 0,9; log 5 = log(10/2) = 1 − 0,3 = 0,7.",
 tr:[{e:"log₃ 81",r:["3⁴ = 81","= 4"]},{e:"Uma população de 500 dobra a cada 3 anos. Em quanto tempo chega a 4 000?",r:["4 000 ÷ 500 = 8 = 2³ → 3 períodos","3 × 3 = 9 anos"]}]},

{g:"⚡ Física", t:"Como isolar uma variável na fórmula", q:"Toda questão de Física com conta.",
 p:["Escreva a fórmula e marque o que você quer achar.","O que está <b>multiplicando</b> passa para o outro lado <b>dividindo</b> (e vice-versa).","O que está <b>somando</b> passa <b>subtraindo</b>.","Se a letra está ao quadrado, tire a raiz no final.","Substitua os números SÓ no fim, com as unidades no SI."],
 ex:[{e:"Ec = m · v² / 2. Ache v.",s:["2 · Ec = m · v²","v² = 2Ec / m","<b>v = √(2Ec / m)</b>"]},{e:"Um carro a 72 km/h percorre 360 m. Em quanto tempo?",s:["72 km/h = 20 m/s","v = d/t → t = d/v","t = 360 ÷ 20 = <b>18 s</b>"]}],
 m:"Triângulo mágico para U = R · i: cubra a letra que você quer; o que sobra mostra a conta (R = U/i; i = U/R).",
 tr:[{e:"P = U · i. Com P = 2 200 W e U = 220 V, qual a corrente?",r:["i = P/U","i = 2200 ÷ 220 = 10 A"]},{e:"Q = m·c·ΔT. Com Q = 6 000 cal, m = 200 g e c = 1 cal/g°C, qual a variação de temperatura?",r:["ΔT = Q/(m·c)","ΔT = 6000 ÷ 200 = 30 °C"]},{e:"Ec = 200 J e m = 4 kg. Qual a velocidade?",r:["v = √(2 · 200 / 4)","v = √100 = 10 m/s"]}]},

{g:"⚡ Física", t:"Gráficos de movimento (s × t e v × t)", q:"O ENEM adora gráficos de velocidade, de viagens e de frenagem.",
 p:["<b>Gráfico s × t:</b> reta inclinada = velocidade constante; reta horizontal = parado. Inclinação = velocidade.","<b>Gráfico v × t:</b> reta horizontal = velocidade constante; reta inclinada = aceleração.","Inclinação do v × t = aceleração (a = Δv/Δt).","<b>Área sob o gráfico v × t = distância percorrida.</b>"],
 ex:[{e:"Um carro vai de 0 a 30 m/s em 10 s (reta). Qual a aceleração e a distância percorrida?",s:["a = 30 ÷ 10 = <b>3 m/s²</b>","Área do triângulo = base × altura ÷ 2 = 10 × 30 ÷ 2 = <b>150 m</b>"]}],
 m:"Área de retângulo (velocidade constante) = v × t. Área de triângulo = metade disso. Trapézio: (B + b) × h ÷ 2.",
 tr:[{e:"Um ônibus anda a 20 m/s constantes durante 10 s e depois freia até parar em 4 s. Qual a distância total?",r:["Retângulo: 20 × 10 = 200 m","Triângulo da frenagem: 4 × 20 ÷ 2 = 40 m","Total: 240 m"]}]},

{g:"🧪 Química", t:"Massa molar e número de mols", q:"Base de toda estequiometria e cálculo de concentração.",
 p:["Olhe a fórmula e conte os átomos de cada elemento (o número pequeno depois do símbolo).","Multiplique pela massa atômica de cada elemento.","Some tudo → massa molar (g/mol).","Número de mols: <span class='f'>n = massa ÷ massa molar</span>."],
 ex:[{e:"Massa molar do H₂SO₄ (H = 1, S = 32, O = 16)",s:["H: 2 × 1 = 2","S: 1 × 32 = 32","O: 4 × 16 = 64","Total: <b>98 g/mol</b>"]}],
 m:"Números fora dos parênteses multiplicam tudo dentro: Ca(OH)₂ tem 1 Ca, 2 O e 2 H.",
 tr:[{e:"Massa molar da glicose C₆H₁₂O₆ (C = 12, H = 1, O = 16)",r:["C: 6 × 12 = 72","H: 12 × 1 = 12","O: 6 × 16 = 96","Total: 180 g/mol"]},{e:"Quantos mols há em 90 g de glicose?",r:["n = 90 ÷ 180","n = 0,5 mol"]},{e:"Massa molar do Ca(OH)₂ (Ca = 40)",r:["40 + 2 × 16 + 2 × 1","= 74 g/mol"]}]},

{g:"🧪 Química", t:"Como balancear uma equação química", q:"Antes de qualquer cálculo estequiométrico; combustão; reações do cotidiano.",
 p:["Comece pelo elemento que aparece em UMA substância de cada lado (geralmente metais, depois o C).","Depois acerte o H.","Deixe o O (e substâncias simples como O₂) por último.","Ajuste só os COEFICIENTES (números da frente) — nunca mude os índices.","Confira: cada elemento deve ter a mesma quantidade dos dois lados."],
 ex:[{e:"CH₄ + O₂ → CO₂ + H₂O",s:["C: 1 de cada lado ✓","H: 4 à esquerda → coloque 2 H₂O","O à direita: 2 (do CO₂) + 2 (das 2 H₂O) = 4 → coloque 2 O₂","<b>CH₄ + 2 O₂ → CO₂ + 2 H₂O</b>"]},{e:"Fe + O₂ → Fe₂O₃",s:["O: 2 à esquerda e 3 à direita → MMC = 6 → 3 O₂ e 2 Fe₂O₃","Fe: 4 à direita → 4 Fe","<b>4 Fe + 3 O₂ → 2 Fe₂O₃</b>"]}],
 m:"Na combustão de hidrocarbonetos: coeficiente do CO₂ = nº de C; da H₂O = nº de H ÷ 2; depois acerte o O₂.",
 tr:[{e:"H₂ + O₂ → H₂O",r:["2 H₂ + O₂ → 2 H₂O"]},{e:"C₃H₈ + O₂ → CO₂ + H₂O",r:["3 CO₂ (3 C) e 4 H₂O (8 H)","O à direita: 6 + 4 = 10 → 5 O₂","C₃H₈ + 5 O₂ → 3 CO₂ + 4 H₂O"]},{e:"N₂ + H₂ → NH₃",r:["N: 2 → 2 NH₃","H: 6 → 3 H₂","N₂ + 3 H₂ → 2 NH₃"]}]},

{g:"🧪 Química", t:"Número de oxidação (Nox)", q:"Pilhas, corrosão, ferrugem, oxirredução, agentes oxidante e redutor.",
 p:["Substância simples (Fe, O₂, H₂): Nox = 0.","H = +1 e O = −2 (na maioria dos casos).","Metais do grupo 1 (Na, K) = +1; grupo 2 (Ca, Mg) = +2.","Em uma molécula, a soma dos Nox = 0; em um íon, a soma = carga do íon.","Nox AUMENTOU → oxidou (é o agente redutor). DIMINUIU → reduziu (é o agente oxidante)."],
 ex:[{e:"Nox do S no H₂SO₄",s:["2·(+1) + S + 4·(−2) = 0","2 + S − 8 = 0","<b>S = +6</b>"]},{e:"Zn + Cu²⁺ → Zn²⁺ + Cu",s:["Zn: 0 → +2 → oxidou (agente redutor)","Cu: +2 → 0 → reduziu (agente oxidante)"]}],
 m:"'Perdeu elétrons, oxidou; ganhou elétrons, reduziu' — o Nox sobe quando perde elétrons.",
 tr:[{e:"Nox do N no HNO₃",r:["+1 + N + 3·(−2) = 0","N = +5"]},{e:"Nox do Mn no KMnO₄",r:["+1 + Mn − 8 = 0","Mn = +7"]}]},

{g:"🧪 Química", t:"Concentração em mol/L e ppm", q:"Soro, flúor na água, poluentes, medicamentos.",
 p:["<b>g/L</b>: C = massa (g) ÷ volume (L).","<b>mol/L</b>: M = nº de mols ÷ volume (L). (Se tiver massa, transforme em mol antes.)","<b>ppm</b> (partes por milhão): mg por kg ou mg por L (em água).","Converta mL para L: ÷ 1000."],
 ex:[{e:"0,2 mol de soluto em 500 mL",s:["500 mL = 0,5 L","M = 0,2 ÷ 0,5 = <b>0,4 mol/L</b>"]},{e:"Uma água tem 0,002 g de flúor por litro. Quantos ppm?",s:["0,002 g = 2 mg","2 mg/L = <b>2 ppm</b>"]}],
 m:"Não esqueça: o volume é da SOLUÇÃO, não só do solvente.",
 tr:[{e:"5,85 g de NaCl (58,5 g/mol) em 1 L. Concentração em mol/L?",r:["n = 5,85 ÷ 58,5 = 0,1 mol","M = 0,1 ÷ 1 = 0,1 mol/L"]},{e:"Soro fisiológico: 9 g de sal em 1 L. Quantos gramas em 250 mL?",r:["250 mL = 0,25 L","9 × 0,25 = 2,25 g"]}]},

{g:"🧬 Biologia", t:"Quadro de Punnett (cruzamentos)", q:"Genética: probabilidade de filhos com determinada característica.",
 p:["Escreva o genótipo dos pais (ex.: Aa × aa).","Separe os gametas de cada um: Aa → A e a; aa → a e a.","Monte o quadro 2 × 2 combinando os gametas.","Conte os resultados (cada quadradinho = 1/4).","Para DUAS características (AaBb), calcule cada uma separadamente e multiplique."],
 ex:[{e:"Aa × aa",s:["Gametas: (A, a) × (a, a)","Filhos: Aa, Aa, aa, aa","<b>1/2 Aa (dominante) e 1/2 aa (recessivo)</b>"]},{e:"AaBb × AaBb: probabilidade de aabb?",s:["aa em Aa × Aa = 1/4","bb em Bb × Bb = 1/4","1/4 × 1/4 = <b>1/16</b>"]}],
 m:"Proporções que caem sempre: Aa × Aa → 3:1; Aa × aa → 1:1; AA × qualquer → 100% dominante.",
 tr:[{e:"AA × aa: proporção dos filhos?",r:["Todos Aa → 100% com fenótipo dominante"]},{e:"AaBb × aabb: probabilidade de Aabb?",r:["Aa em Aa × aa = 1/2","bb em Bb × bb = 1/2","1/2 × 1/2 = 1/4"]}]},

{g:"🧬 Biologia", t:"Como ler um heredograma", q:"Doenças genéticas em famílias (albinismo, daltonismo, hemofilia).",
 p:["Símbolos: □ homem, ○ mulher, pintado = afetado; traço horizontal = casal; traço vertical = filhos.","<b>Pais normais com filho afetado → herança RECESSIVA</b> e os pais são Aa.","<b>Pais afetados com filho normal → herança DOMINANTE</b> e os pais são Aa.","Muito mais homens afetados, passando de mãe para filho → provavelmente ligada ao X (daltonismo, hemofilia).","Comece descobrindo os genótipos dos afetados (aa se recessiva) e depois dos pais."],
 ex:[{e:"Casal normal tem uma filha afetada. A herança é dominante ou recessiva?",s:["Os pais são normais, mas 'esconderam' o alelo → recessiva","Pais = Aa e Aa; filha = aa"]}],

 {t:"Modelos atômicos e tabela periódica",b:["Dalton: bola maciça. Thomson: 'pudim de passas' (descobriu o elétron). Rutherford: núcleo pequeno e denso + eletrosfera (experimento da folha de ouro). <b>Bohr</b>: elétrons em níveis de energia; ao voltar de um nível, emitem luz → <b>cores dos fogos de artifício</b>.","Z = nº de prótons; A = prótons + nêutrons. Isótopos: mesmo Z (ex.: C-12 e C-14).","Famílias: 1 alcalinos (Na, K), 2 alcalino-terrosos (Ca, Mg), 17 halogênios (F, Cl), 18 gases nobres (estáveis)."],
  f:[["Que modelo explica as cores dos fogos de artifício?","Bohr (salto dos elétrons entre níveis emitindo luz)."]]},
 {t:"Ligações químicas, polaridade e sabões",b:["<b>Iônica</b>: metal + ametal (NaCl); conduz eletricidade dissolvida ou fundida.","<b>Covalente</b>: ametais compartilham elétrons (H₂O, CO₂).","<b>Metálica</b>: 'mar de elétrons'; conduz no estado sólido.","<b>Semelhante dissolve semelhante</b>: polar dissolve polar (água + sal/açúcar); apolar dissolve apolar (gasolina + óleo).","Sabão/detergente: cauda apolar 'agarra' a gordura e cabeça polar 'agarra' a água → micelas.","Ligações de hidrogênio deixam a água com alto ponto de ebulição."],
  f:[["Como o sabão remove a gordura?","A parte apolar se liga à gordura e a parte polar à água, formando micelas que a água leva embora."]]},
 {t:"Termoquímica e cinética química",b:["<b>Exotérmica</b>: libera calor, ΔH &lt; 0 (combustão, compressa quente).","<b>Endotérmica</b>: absorve calor, ΔH &gt; 0 (compressa fria, fotossíntese, cozinhar alimentos).","A velocidade de uma reação aumenta com: maior <b>temperatura</b>, maior <b>concentração</b>, maior <b>superfície de contato</b> (comprimido triturado, lenha em gravetos) e <b>catalisador</b> (diminui a energia de ativação; enzimas, catalisador do carro)."],
  f:[["Por que alimentos duram mais na geladeira?","Temperatura menor → reações de decomposição mais lentas."],["Por que o comprimido efervescente dissolve mais rápido em pó?","Maior superfície de contato."]]},
 {t:"Equilíbrio químico (Le Chatelier)",b:["Um sistema em equilíbrio, quando perturbado, se desloca para <b>compensar</b> a perturbação.","Adicionar reagente → desloca para os produtos; retirar produto → também.","Aumentar a pressão → desloca para o lado com <b>menos mols de gás</b>.","Aumentar a temperatura → favorece o sentido <b>endotérmico</b>.","Catalisador NÃO desloca equilíbrio, só faz chegar mais rápido."],
  f:[["Por que o refrigerante 'perde o gás' ao abrir?","A pressão cai e o equilíbrio do CO₂ dissolvido se desloca para a liberação do gás."]]},
 {t:"Química orgânica: funções, isomeria e polímeros",b:["Hidrocarboneto: só C e H (gasolina, gás de cozinha). <b>Álcool</b>: –OH em carbono saturado (etanol). <b>Fenol</b>: –OH ligado ao anel aromático.","<b>Aldeído</b>: –CHO (formol). <b>Cetona</b>: C=O no meio da cadeia (acetona). <b>Ácido carboxílico</b>: –COOH (vinagre). <b>Éster</b>: aromas e sabores (essências de frutas). <b>Amina</b>: contém N (cheiro de peixe).","<b>Isomeria óptica</b>: carbono quiral (4 ligantes diferentes) → moléculas 'espelhadas' com efeitos diferentes (caso da talidomida).","Polímeros: de adição (polietileno, PVC, isopor) e de condensação (PET, náilon). Plásticos comuns demoram séculos para se degradar.","Biocombustíveis: etanol (fermentação da cana) e biodiesel (transesterificação de óleos) — renováveis."],
  f:[["Qual a função orgânica do vinagre?","Ácido carboxílico (ácido acético)."],["Que tipo de isomeria explica a tragédia da talidomida?","Isomeria óptica."]]},
 {t:"Eletrólise e corrosão",b:["Pilha: reação espontânea gera corrente. <b>Eletrólise</b>: corrente força uma reação não espontânea (produção de alumínio, cloro, galvanoplastia/cromagem).","Ferrugem: oxidação do ferro com O₂ e água (mais rápida em maresia).","Proteção: pintura, <b>galvanização</b> (cobrir com zinco) e <b>metal de sacrifício</b> (zinco ou magnésio oxidam no lugar do ferro — cascos de navios)."],
  f:[["Por que um prego galvanizado não enferruja?","O zinco é mais reativo e oxida antes do ferro (metal de sacrifício)."]]}
]},
{d:"🧬 Biologia", tp:[
 {t:"Citologia",b:["Procariontes (bactérias): sem núcleo organizado. Eucariontes: com núcleo (animais, plantas, fungos, protozoários).","<b>Mitocôndria</b>: respiração celular (energia/ATP). <b>Cloroplasto</b>: fotossíntese (só em plantas e algas). <b>Ribossomo</b>: produz proteínas. <b>Lisossomo</b>: digestão celular. <b>Complexo golgiense</b>: secreção.","Membrana plasmática: permeabilidade seletiva. <b>Osmose</b>: a água vai do meio menos concentrado para o mais concentrado (salada temperada murcha; carne-seca é conservada no sal).","Vírus não são células e não se reproduzem fora delas → antibióticos não funcionam contra vírus."],
  f:[["Por que a salada com sal murcha?","Osmose: a água sai das células para o meio mais concentrado (salgado)."],["Antibiótico trata gripe?","Não; gripe é causada por vírus."]]},
 {t:"DNA, divisão celular e biotecnologia",b:["DNA → (transcrição) → RNA → (tradução) → proteína.","<b>Mitose</b>: 1 célula → 2 iguais (crescimento, regeneração). <b>Meiose</b>: 1 → 4 com metade dos cromossomos (gametas; gera variabilidade).","<b>Transgênico</b>: recebe gene de OUTRA espécie (milho Bt resistente a pragas, insulina produzida por bactérias).","<b>Clone</b>: cópia genética idêntica (ovelha Dolly).","<b>PCR</b>: multiplica trechos de DNA/RNA (testes de COVID, investigação criminal). Teste de paternidade compara DNA.","Células-tronco: podem originar diferentes tecidos. Vacinas de RNA mensageiro fazem a célula produzir um antígeno."],
  f:[["Diferença entre transgênico e clone?","Transgênico recebe gene de outra espécie; clone é uma cópia genética idêntica."]]},
 {t:"Bioenergética: fotossíntese, respiração e fermentação",b:["<b>Fotossíntese</b> (cloroplasto): 6 CO₂ + 6 H₂O + luz → glicose + 6 O₂.","<b>Respiração aeróbica</b> (mitocôndria): glicose + O₂ → CO₂ + H₂O + muita energia.","<b>Fermentação</b> (sem O₂, pouca energia): <i>alcoólica</i> (leveduras: pão, vinho, cerveja, etanol — libera CO₂) e <i>lática</i> (bactérias do iogurte; músculos em esforço intenso)."],
  f:[["O que faz a massa do pão crescer?","O CO₂ liberado na fermentação alcoólica das leveduras."]]},
 {t:"Fisiologia humana",b:["<b>Digestão</b>: boca (amilase salivar), estômago (pepsina, meio ácido), intestino delgado (absorção); fígado produz bile (emulsiona gorduras); pâncreas produz enzimas e insulina.","<b>Circulação</b>: coração com 4 cavidades; artérias saem do coração, veias chegam a ele.","<b>Respiração</b>: trocas gasosas nos alvéolos.","<b>Excreção</b>: rins filtram o sangue (néfrons) e eliminam ureia.","<b>Hormônios</b>: insulina baixa a glicose e glucagon aumenta; adrenalina (luta ou fuga); tireoide (metabolismo). Diabetes tipo 1: pâncreas não produz insulina; tipo 2: resistência à insulina (ligada a hábitos)."],
  f:[["Qual órgão produz a insulina?","O pâncreas."],["Artérias levam o sangue para onde?","Do coração para o corpo."]]},
 {t:"Doenças e parasitoses",b:["<b>Vírus</b>: dengue, zika, chikungunya e febre amarela (mosquito <i>Aedes aegypti</i>), HIV, gripe, COVID-19, sarampo, raiva.","<b>Bactérias</b>: tuberculose, hanseníase, <b>leptospirose</b> (urina de rato, enchentes), cólera, tétano, sífilis.","<b>Protozoários</b>: malária (mosquito <i>Anopheles</i>), doença de Chagas (barbeiro), leishmaniose, giardíase, toxoplasmose.","<b>Vermes</b>: esquistossomose (caramujo, água contaminada), teníase/cisticercose (carne de porco/boi malcozida), ascaridíase, amarelão (andar descalço).","Prevenção mais cobrada: <b>saneamento básico</b>, eliminar água parada, vacinação."],
  f:[["Por que casos de leptospirose aumentam após enchentes?","A água mistura-se com a urina de ratos contaminados."],["Qual a principal forma de prevenir a dengue?","Eliminar recipientes com água parada (criadouros do Aedes)."]]},
 {t:"Botânica e zoologia",b:["Plantas: <b>briófitas</b> (musgos; sem vasos), <b>pteridófitas</b> (samambaias; com vasos, sem sementes), <b>gimnospermas</b> (pinheiros; sementes 'nuas'), <b>angiospermas</b> (flores e frutos).","Polinização (vento, insetos, aves, morcegos) e dispersão de sementes (animais, vento, água).","Hormônios vegetais: <b>auxina</b> (crescimento em direção à luz) e <b>etileno</b> (amadurecimento — fruta embrulhada amadurece mais rápido).","Vertebrados: peixes, anfíbios (respiração cutânea, sensíveis à poluição — bioindicadores), répteis (ovo com casca), aves e mamíferos (endotérmicos)."],
  f:[["Por que embrulhar bananas acelera o amadurecimento?","O gás etileno liberado fica concentrado."]]},
 {t:"Ecologia e impactos ambientais",b:["<b>Efeito estufa</b> (natural, intensificado por CO₂ e CH₄) ≠ <b>camada de ozônio</b> (destruída por CFCs; protege do UV).","<b>Eutrofização</b>: esgoto/fertilizantes → excesso de nutrientes → proliferação de algas → falta de O₂ → morte de peixes.","<b>Sucessão ecológica</b>: espécies pioneiras (liquens) preparam o ambiente até a comunidade clímax.","Espécies invasoras (ex.: mexilhão-dourado, javali) desequilibram ecossistemas.","Mata ciliar protege rios contra erosão e assoreamento."],
  f:[["O que é eutrofização?","Excesso de nutrientes na água → explosão de algas → falta de oxigênio → morte de peixes."]]}
]},
{d:"📜 História", tp:[
 {t:"Antiguidade (Grécia e Roma)",b:["<b>Atenas</b>: berço da democracia direta, mas só homens livres nascidos em Atenas eram cidadãos (excluía mulheres, escravizados e estrangeiros). <b>Esparta</b>: sociedade militarizada.","<b>Roma</b>: Monarquia → República (patrícios × plebeus; Senado) → Império. 'Pão e circo' para controlar a população. Cristianismo vira religião oficial no séc. IV.","Herança: direito romano, filosofia, conceito de cidadania."],
  f:[["A democracia ateniense era para todos?","Não: excluía mulheres, escravizados e estrangeiros."]]},
 {t:"Idade Média",b:["<b>Feudalismo</b>: economia agrária, terra como riqueza, relações de suserania e vassalagem, servos presos à terra.","Igreja Católica com grande poder político e cultural.","Cruzadas, renascimento comercial e urbano (burgos, burguesia), Peste Negra (séc. XIV)."],
  f:[["Qual a base econômica do feudalismo?","A terra e o trabalho servil no campo."]]},
 {t:"Idade Moderna e Iluminismo",b:["<b>Renascimento</b>: humanismo e antropocentrismo (o ser humano no centro).","<b>Reforma Protestante</b> (Lutero, 1517): crítica à venda de indulgências.","Grandes Navegações, mercantilismo (acúmulo de metais, balança favorável) e absolutismo (rei com poder total).","<b>Iluminismo</b> (séc. XVIII): razão contra o absolutismo e os privilégios. Montesquieu (três poderes), Voltaire (tolerância, liberdade de expressão), Rousseau (soberania popular). Inspirou a Revolução Francesa e as independências na América."],
  f:[["Quem propôs a divisão em três poderes?","Montesquieu."]]},
 {t:"Brasil Colônia",b:["Capitanias hereditárias (1534) e Governo-Geral (1548).","<b>Ciclo do açúcar</b> no Nordeste: <b>plantation</b> = latifúndio + monocultura + trabalho escravizado + exportação.","Jesuítas e catequese dos indígenas; bandeirantes expandiram o território e escravizaram indígenas.","<b>Resistência</b>: quilombos (Palmares, Zumbi — 20 de novembro, Dia da Consciência Negra), fugas, revoltas.","<b>Mineração</b> (séc. XVIII, MG): interiorização, urbanização, capital transferida para o Rio (1763), cobrança de impostos (quinto, derrama).","Revoltas: Inconfidência Mineira (1789, elite, Tiradentes) e Conjuração Baiana (1798, popular, defendia o fim da escravidão).","1808: chegada da família real e abertura dos portos."],
  f:[["Quais as características da plantation?","Latifúndio, monocultura, mão de obra escravizada e produção para exportação."],["Diferença entre Inconfidência Mineira e Conjuração Baiana?","Mineira: liderada pela elite, não propunha abolição. Baiana: popular, defendia igualdade e o fim da escravidão."]]},
 {t:"Brasil Império",b:["Independência (1822) feita pela elite, mantendo escravidão e monarquia.","Período Regencial (1831–1840): revoltas — Cabanagem (PA), Balaiada (MA), Sabinada (BA), Farroupilha (RS), <b>Revolta dos Malês</b> (1835, escravizados muçulmanos em Salvador).","Café no Sudeste e imigração europeia (política de 'branqueamento').","Abolição gradual: Lei Eusébio de Queirós (1850, fim do tráfico), Ventre Livre (1871), Sexagenários (1885), Áurea (1888)."],
  f:[["Qual lei proibiu o tráfico de escravizados para o Brasil?","Lei Eusébio de Queirós (1850)."]]},
 {t:"Idade Contemporânea (mundo)",b:["<b>Revolução Industrial</b> (Inglaterra, séc. XVIII): máquina a vapor, fábricas, proletariado, jornadas exaustivas, trabalho infantil; reações: ludismo (quebrar máquinas) e cartismo (direitos políticos).","<b>Revolução Francesa</b> (1789): 'Liberdade, Igualdade, Fraternidade'; Declaração dos Direitos do Homem e do Cidadão; fim dos privilégios.","<b>Imperialismo</b> (séc. XIX): partilha da África (Conferência de Berlim, 1884–85), justificada por ideias racistas.","1ª Guerra (1914–1918); Revolução Russa (1917); Crise de 1929; totalitarismos (nazismo, fascismo); 2ª Guerra (1939–1945) e Holocausto.","ONU (1945) e Declaração Universal dos Direitos Humanos (1948).","<b>Guerra Fria</b> (EUA capitalista × URSS socialista): corrida armamentista e espacial, Muro de Berlim (1961–1989), fim da URSS (1991). Descolonização da África e da Ásia."],
  f:[["O que foi o ludismo?","Movimento de trabalhadores que quebravam máquinas, culpando-as pelo desemprego e pela exploração."],["O que marcou o fim da Guerra Fria?","Queda do Muro de Berlim (1989) e fim da URSS (1991)."]]},
 {t:"Redemocratização e Brasil recente",b:["Anistia (1979), Diretas Já (1984), eleição indireta de Tancredo (1985).","<b>Constituição de 1988</b>: direitos sociais, SUS, voto facultativo para analfabetos e jovens de 16–17 anos, racismo como crime inafiançável.","Impeachment de Collor (1992), Plano Real (1994, controle da inflação)."],
  f:[["Por que a Constituição de 1988 é chamada de 'Cidadã'?","Pela ampliação de direitos sociais, civis e políticos após a ditadura."]]}
]},
{d:"🌎 Geografia", tp:[
 {t:"Cartografia e fusos horários",b:["<b>Latitude</b>: distância ao Equador (0° a 90° N ou S), medida pelos paralelos. <b>Longitude</b>: distância a Greenwich (0° a 180° L ou O), pelos meridianos.","<b>Fusos</b>: 360° ÷ 24 h = 15° por hora. Indo para o LESTE, as horas aumentam; para o OESTE, diminuem.","Projeção de <b>Mercator</b>: preserva formas, mas distorce áreas perto dos polos (Groenlândia parece enorme). <b>Peters</b>: preserva áreas, distorce formas.","Curvas de nível: quanto mais próximas, mais íngreme o terreno."],
  f:[["São 15h em Londres (0°). Que horas são em Brasília (3 fusos a oeste)?","15 − 3 = 12h."],["Por que a Groenlândia parece maior que o Brasil em muitos mapas?","A projeção de Mercator distorce as áreas em altas latitudes."]]},
 {t:"Geologia, relevo e solos",b:["Placas tectônicas: terremotos e vulcões nas <b>bordas</b> (Chile, Japão). O Brasil fica no centro da placa Sul-Americana → poucos terremotos fortes.","Intemperismo (físico e químico) desgasta as rochas; erosão transporta o material.","Desmatamento → erosão, <b>voçorocas</b>, <b>assoreamento</b> dos rios.","Relevo brasileiro: planaltos, planícies e depressões (classificação de Jurandyr Ross); altitudes modestas e formas antigas e desgastadas."],
  f:[["Por que o Brasil quase não sofre terremotos fortes?","Está no interior da placa Sul-Americana, longe das bordas."]]},
 {t:"Clima e fenômenos climáticos",b:["Fatores: latitude, altitude, maritimidade × continentalidade, massas de ar, correntes marítimas, vegetação.","Climas do Brasil: equatorial (Amazônia), tropical, tropical de altitude, semiárido (Sertão), subtropical (Sul).","<b>El Niño</b>: aquecimento do Pacífico → secas no Norte/Nordeste e chuvas fortes no Sul. <b>La Niña</b>: o inverso (resfriamento).","<b>Rios voadores</b>: umidade da Amazônia levada pelos ventos até o Centro-Sul → desmatamento afeta chuvas em outras regiões.","Semiárido: chuvas irregulares; soluções de convivência (cisternas)."],
  f:[["Qual o efeito do El Niño no Nordeste?","Agrava as secas."]]},
 {t:"População",b:["<b>Transição demográfica</b>: natalidade e mortalidade caem → população envelhece. Pirâmide brasileira: base estreitando e topo alargando.","Bônus demográfico: muita gente em idade de trabalhar (oportunidade econômica, mas temporária).","Migrações: êxodo rural, nordestinos para o Sudeste (séc. XX), migração de retorno, refugiados (venezuelanos, haitianos), xenofobia.","IDH: renda, educação e longevidade."],
  f:[["O que acontece com a pirâmide etária do Brasil?","A base estreita (menos nascimentos) e o topo alarga (mais idosos)."]]},
 {t:"Espaço agrário",b:["Concentração fundiária (latifúndios) desde as sesmarias e a Lei de Terras (1850).","<b>Agronegócio</b>: monocultura mecanizada de commodities para exportação (soja, milho, carne, cana).","<b>Agricultura familiar</b>: pequenas propriedades, produz grande parte dos alimentos consumidos no país.","<b>Revolução Verde</b>: mecanização, agrotóxicos, sementes selecionadas → mais produção, mas impactos ambientais, endividamento e êxodo rural.","Conflitos: reforma agrária, MST, povos indígenas e quilombolas; agroecologia como alternativa."],
  f:[["O que foi a Revolução Verde?","Modernização agrícola com máquinas, agrotóxicos e sementes melhoradas, aumentando a produção, mas com impactos sociais e ambientais."]]},
 {t:"Indústria, trabalho, energia e globalização",b:["<b>Fordismo</b>: linha de montagem, produção em massa, grandes estoques. <b>Toyotismo</b>: produção flexível, <i>just in time</i> (estoque mínimo), trabalhador multifuncional.","Hoje: Indústria 4.0 (automação, robôs), terceirização e <b>uberização</b> (trabalho por aplicativo, sem direitos trabalhistas).","Desconcentração industrial no Brasil (guerra fiscal entre estados).","Energia: renováveis (hidráulica, eólica — forte no Nordeste, solar, biomassa) × não renováveis (petróleo, pré-sal, carvão, gás). Matriz elétrica brasileira majoritariamente renovável.","Globalização: multinacionais, blocos econômicos (Mercosul, UE), desigualdades entre países; conflitos geopolíticos (Rússia–Ucrânia, Israel–Palestina)."],
  f:[["Diferença entre fordismo e toyotismo?","Fordismo: produção em massa e estoques. Toyotismo: produção flexível sob demanda (just in time)."]]}
]},
{d:"🤔 Filosofia (complementos)", tp:[
 {t:"Dos pré-socráticos à Idade Média",b:["<b>Pré-socráticos</b>: buscavam a <i>arché</i> (origem de tudo). Tales: água. <b>Heráclito</b>: tudo muda ('ninguém se banha duas vezes no mesmo rio'). <b>Parmênides</b>: o ser é imutável.","<b>Sofistas</b>: retórica e relativismo ('o homem é a medida de todas as coisas' — Protágoras).","<b>Santo Agostinho</b>: fé acima da razão (influência de Platão). <b>Tomás de Aquino</b>: conciliação entre fé e razão (influência de Aristóteles)."],
  f:[["'Ninguém se banha duas vezes no mesmo rio' é de quem?","Heráclito (tudo está em constante mudança)."]]},
 {t:"Filosofia moderna",b:["<b>Descartes</b>: 'Penso, logo existo'; dúvida metódica; racionalismo (conhecimento pela razão).","<b>Empirismo</b> (Locke, Hume): conhecimento vem da experiência; mente como 'tábula rasa'.","<b>Kant</b>: síntese entre razão e experiência; ética do dever (imperativo categórico: aja como se sua ação devesse virar lei universal).","<b>Maquiavel</b>: 'os fins justificam os meios' (frase atribuída); a política tem lógica própria."],
  f:[["Qual a diferença entre racionalismo e empirismo?","Racionalismo: conhecimento vem da razão. Empirismo: vem da experiência sensível."]]},
 {t:"Filosofia contemporânea e ética",b:["<b>Utilitarismo</b> (Bentham, Mill): ação correta é a que gera a maior felicidade para o maior número.","<b>Nietzsche</b>: 'Deus está morto'; crítica à moral tradicional; super-homem.","<b>Sartre</b>: 'a existência precede a essência'; o ser humano está 'condenado a ser livre' e é responsável por suas escolhas.","<b>Foucault</b>: poder disciplinar, vigilância (panóptico), instituições como prisões, escolas e hospitais.","<b>Hannah Arendt</b>: banalidade do mal. <b>Simone de Beauvoir</b>: 'Ninguém nasce mulher, torna-se mulher'."],
  f:[["Quem disse que 'a existência precede a essência'?","Jean-Paul Sartre."],["O panóptico é associado a qual filósofo?","Michel Foucault (sociedade disciplinar e vigilância)."]]}
]},
{d:"👥 Sociologia (complementos)", tp:[
 {t:"Cultura, etnocentrismo e identidade",b:["<b>Etnocentrismo</b>: julgar outras culturas a partir da sua, considerando-a superior.","<b>Relativismo cultural</b>: compreender cada cultura em seu próprio contexto.","Aculturação, hibridismo cultural, cultura popular × erudita × de massa.","'<b>Democracia racial</b>' (ideia associada a Gilberto Freyre) foi criticada como mito por Florestan Fernandes: o racismo persiste."],
  f:[["O que é etnocentrismo?","Avaliar outras culturas tendo a própria como padrão superior."]]},
 {t:"Trabalho, cidadania e movimentos sociais",b:["Taylorismo (tempo e movimento), fordismo e toyotismo; precarização e uberização.","Cidadania (T. H. Marshall): direitos civis, políticos e sociais — conquistados historicamente.","Movimentos sociais: negro, feminista, indígena, LGBTQIA+, MST, ambientalista. O ENEM costuma valorizá-los como ampliação da cidadania.","Desigualdade, estratificação, mobilidade social; racismo estrutural (Silvio Almeida)."],

function aulaDe(q){
  if(q.a==="red") return "red";
  if(q.a==="hum") return q.m==="História"?"hist":(q.m==="Geografia"?"geo2":"filo");
  if(q.a==="lin") return (q.m==="Inglês"||q.m==="Espanhol")?"lingua":"interp";
  const R=[["Porcentagem","porc"],["Variação percentual","porc"],["Juros","porc"],["Geometria","geo"],["Pitágoras","geo"],
    ["Escala","prop"],["Regra de três","prop"],["Razão","prop"],["Estatística","est"],["Probabilidade","prob"],["ombinat","prob"],
    ["Função","func"],["Sequências","func"],["Eletricidade","ele"],["Circuitos","ele"],["Velocidade","fis"],["Mecânica","fis"],
    ["energia","fis"],["Ondulatória","fis"],["Calorimetria","fis"],["Óptica","fis"],["Soluções","qui1"],["Estequiometria","qui1"],
    ["Mol","qui1"],["ambiental","qui2"],["pH","qui2"],["Separação","qui2"],["Eletroquímica","qui2"],["Radioatividade","qui2"],
    ["Genética","gen"]];
  for(const [s,id] of R) if(q.t.includes(s)) return id;
  return "eco";
}

    <textarea id="txt" oninput="salvaTxt()" style="width:100%;min-height:320px;border:1px solid var(--line);border-radius:10px;padding:12px;font:16px/1.6 inherit;background:var(--bg);color:var(--text)">${rascunho.replace(/</g,"&lt;")}</textarea>
    <p class="small muted" id="cont"></p>
    <b>Checklist antes de entregar</b>
    ${CHECK.map((c,i)=>`<label style="display:flex;gap:8px;margin:6px 0;align-items:flex-start"><input type="checkbox" ${state["ck"+i]?"checked":""} onchange="state['ck${i}']=this.checked;save()"> <span class="small">${c}</span></label>`).join("")}
  </div>
  <h3>📚 Material de referência</h3>
  ${REDACAO}`;
}
function salvaTxt(){
  const v=document.getElementById("txt").value;
  try{ localStorage.setItem("enemRedacao",v); }catch(e){}
  contar();
}
function contar(){
  const el=document.getElementById("txt"); if(!el) return;
  const v=el.value, pal=(v.trim().match(/\S+/g)||[]).length;
  const linhas=v.split("\n").reduce((s,l)=>s+Math.max(1,Math.ceil(l.length/75)),0);
  document.getElementById("cont").textContent=`${pal} palavras · cerca de ${v.trim()?linhas:0} linhas na folha oficial (ideal: 25 a 30; a média é de 10 palavras por linha)`;
}

/* ===================== APP ===================== */
let state = {};
try { state = JSON.parse(localStorage.getItem("enemRev") || "{}"); } catch(e) { state = {}; }
function save(){ try { localStorage.setItem("enemRev", JSON.stringify(state)); } catch(e){} }

const TABS = [
  ["inicio","🏠 Início"],["como","🧮 Como fazer"],["form","📋 Fórmulas"],["apost","📚 Apostila"],["mat","📐 Matemática"],["nat","🧪 Natureza"],["hum","🌎 Humanas"],
  ["lin","📖 Linguagens"],["red","✍️ Redação"],["sim","🎯 Simulado"],["dicas","💡 Dicas"]
];
let current = "inicio", filtro = "Todas", simList = null;

function nav(){
  document.getElementById("nav").innerHTML = TABS.map(([k,v]) =>
    `<button class="${k===current?'on':''}" onclick="go('${k}')">${v}</button>`).join("");
  const ks = Object.keys(state).filter(k=>/^\d+$/.test(k)); const feitas = ks.length, certas = ks.filter(k=>state[k]===true).length;
  document.getElementById("score").textContent = `${certas}/${feitas} acertos · ${Q.length} questões`;
}
function go(k){ current = k; filtro = "Todas"; if(k==="sim") simList = null; render(); window.scrollTo(0,0); }

function qCard(q){
  const i = Q.indexOf(q), resp = state["r"+i];
  const answered = resp !== undefined;
  const alts = q.o.map((txt,j) => {
    let cls = "";
    if(answered){ if(j===q.c) cls="certa"; else if(j===resp) cls="errada"; }
    return `<button class="${cls}" ${answered?"disabled":""} onclick="answer(${i},${j})"><b>${"ABCDE"[j]})</b> ${txt}</button>`;
  }).join("");
  const ok = answered && resp===q.c;
  return `<div class="card q" id="q${i}">
    <span class="tag">${q.m}</span><span class="tema">${q.t}</span>
    <div class="enun">${q.e}</div>
    <div class="alts">${alts}</div>
    <div class="res ${answered?"show":""}">
      <div class="veredito ${ok?"ok":"no"}">${ok?"✅ Acertou!":"❌ Resposta correta: "+"ABCDE"[q.c]}</div>
      <div class="passos"><b>Passo a passo</b><ol>${q.p.map(s=>`<li>${s}</li>`).join("")}</ol></div>
      <div class="dica">💡 ${q.d}</div>
      <div class="btnrow"><button class="btn ghost" onclick="reset(${i})">Tentar de novo</button></div>
    </div>
  </div>`;
}
function answer(i,j){ state["r"+i]=j; state[i]=(j===Q[i].c); save(); rerenderQ(i); nav(); }
function reset(i){ delete state["r"+i]; delete state[i]; save(); rerenderQ(i); nav(); }
function rerenderQ(i){ const el=document.getElementById("q"+i); if(el) el.outerHTML = qCard(Q[i]); }

function areaPage(a){
  const info = AREAS[a], mc = MAIS_COBRADOS[a];
  const aulas = AULAS.filter(x=>x.a===a);
  const total = Q.filter(q=>q.a===a).length;
  return `<h2>${info.icone} ${info.nome}</h2>
  <div class="card">
    <b>🔥 O que mais caiu (2021–2025)</b>
    <p class="small muted" style="margin:4px 0 8px">Em vermelho: cai em praticamente toda prova.</p>
    <div class="chips">${mc.muito.map(t=>`<span class="chip hot">${t}</span>`).join("")}${mc.freq.map(t=>`<span class="chip">${t}</span>`).join("")}</div>
  </div>
  <h3>🎓 Aulas (${aulas.length}) · ${total} questões</h3>
  <p class="small muted" style="margin-top:0">Cada aula tem: teoria → como resolver → exemplo resolvido → erros comuns → exercícios com passo a passo.</p>
  ${aulas.map((x,n)=>{
    const qs = Q.filter(q=>q.a===a && aulaDe(q)===x.id);
    const feitas = qs.filter(q=>state[Q.indexOf(q)]!==undefined).length;
    return `<details><summary>Aula ${n+1} — ${x.titulo} <span class="small muted">(${feitas}/${qs.length})</span></summary><div class="in">
      <p><b>📘 Teoria</b><br>${x.teoria}</p>
      <div class="passos"><b>🛠️ Como resolver (método)</b><ol>${x.metodo.map(s=>`<li>${s}</li>`).join("")}</ol></div>
      <div class="card" style="margin:12px 0"><b>✅ Exemplo resolvido</b><p style="margin:6px 0">${x.ex.e}</p><ol style="margin:0;padding-left:20px">${x.ex.p.map(s=>`<li>${s}</li>`).join("")}</ol></div>
      <div class="dica" style="background:var(--bad-soft)"><b>⚠️ Erros comuns</b><ul class="clean">${x.erros.map(s=>`<li>${s}</li>`).join("")}</ul></div>
      <h3>✏️ Exercícios</h3>
      ${qs.map(qCard).join("")}
    </div></details>`;}).join("")}
  <h3>📝 Resumão (fórmulas e conceitos)</h3>
  ${RESUMOS[a].map(([t,h])=>`<details><summary>${t}</summary><div class="in">${h}</div></details>`).join("")}`;
}
function setF(m){ filtro=m; render(); }

function inicio(){
  const cards = Object.entries(AREAS).map(([k,v])=>{
    const qs = Q.map((q,i)=>[q,i]).filter(([q])=>q.a===k);
    const feitas = qs.filter(([,i])=>state[i]!==undefined).length;
    const pct = Math.round(feitas/qs.length*100);
    return `<button class="area" onclick="go('${k}')"><strong>${v.icone} ${v.nome}</strong>
      <span class="small muted">${feitas}/${qs.length} feitas</span><div class="bar"><i style="width:${pct}%"></i></div></button>`;
  }).join("");
  return `<h2>Bora pra prova! 💪</h2>
  <div class="card">
    <p style="margin-top:0">Este material funciona <b>100% offline</b>. Ele junta os <b>temas que mais caíram no ENEM de 2021 a 2025</b>, como um cursinho: <b>${AULAS.length} aulas</b> (teoria, método, exemplo e erros comuns), <b>${Q.length} questões no estilo ENEM</b> resolvidas passo a passo e um <b>curso de redação</b> com redações-modelo comentadas.</p>
    <p class="small muted" style="margin-bottom:0">Seu progresso fica salvo neste aparelho. Sugestão de roteiro na viagem: 1) Dicas → 2) Curso de Redação → 3) Formulário + Como fazer → 4) Aulas de cada área → 5) Apostila → 6) Simulado.</p>
  </div>
  <div class="grid">${cards}
    <button class="area" onclick="go('como')"><strong>🧮 Como fazer</strong><span class="small muted">Equações, Bhaskara, π, planetas, balanceamento… passo a passo</span></button>
    <button class="area" onclick="go('form')"><strong>📋 Formulário</strong><span class="small muted">Todas as fórmulas numa tela</span></button>
    <button class="area" onclick="go('apost')"><strong>📚 Apostila</strong><span class="small muted">Conteúdo de cursinho de todas as matérias</span></button>
    <button class="area" onclick="go('red')"><strong>✍️ Curso de Redação</strong><span class="small muted">Passo a passo, modelos nota alta, treinos</span></button>
    <button class="area" onclick="go('sim')"><strong>🎯 Simulado</strong><span class="small muted">10 questões aleatórias</span></button>
  </div>
  <div class="btnrow" style="margin-top:16px"><button class="btn ghost" onclick="zerar()">Zerar meu progresso</button></div>`;
}
function zerar(){ if(confirm("Apagar todas as respostas?")){ state={}; save(); render(); } }

function simulado(){
  if(!simList){
    const idx = Q.map((_,i)=>i).sort(()=>Math.random()-0.5).slice(0,10);
    idx.forEach(i=>{ delete state[i]; delete state["r"+i]; }); save();
    simList = idx;
  }
  const feitas = simList.filter(i=>state[i]!==undefined).length;
  const certas = simList.filter(i=>state[i]===true).length;
  return `<h2>🎯 Simulado rápido</h2>
  <div class="card"><b>${feitas}/10 respondidas · ${certas} acertos</b>
    <div class="btnrow"><button class="btn" onclick="simList=null;render()">Novo simulado</button></div></div>
  ${simList.map(i=>qCard(Q[i])).join("")}`;
}

function render(){
  nav();
  const app = document.getElementById("app");
  if(current==="inicio") app.innerHTML = inicio();
  else if(AREAS[current]) app.innerHTML = areaPage(current);
  else if(current==="red"){ app.innerHTML = redacaoPage(); contar(); }
  else if(current==="sim") app.innerHTML = simulado();
  else if(current==="como") app.innerHTML = comoPage();
  else if(current==="form") app.innerHTML = formularioPage();
  else if(current==="apost") app.innerHTML = apostilaPage();
  else if(current==="dicas") app.innerHTML = `<h2>💡 Dicas para o dia da prova</h2>` + DICAS;
}
render();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
